<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Concept Explorer (prototype)</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  body { margin: 0; display: flex; height: 100vh; font-family: system-ui, sans-serif; }
  #cy { flex: 1; }
  #panel { width: 300px; border-left: 1px solid #ccc; padding: 12px; overflow-y: auto; }
  #panel h2 { margin-top: 0; font-size: 16px; }
  .muted { color: #777; font-size: 13px; }
</style>
</head>
<body>
<div id="cy"></div>
<div id="panel">
  <h2>Concept Explorer</h2>
  <p class="muted">Click a node to expand/collapse its sub-concepts and see details.
  Dashed edges = prerequisite / builds-on.</p>
</div>
<script>
const GRAPH = /*GRAPH_JSON*/;

// parent id -> [child ids] via part-of edges (A part-of B: A is a component of B)
const childrenOf = {};
GRAPH.edges.filter(e => e.kind === "part-of").forEach(e => {
  (childrenOf[e.dst] = childrenOf[e.dst] || []).push(e.src);
});

const visible = new Set(GRAPH.nodes.filter(n => (n.level ?? 0) <= 1).map(n => n.id));

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [
    ...GRAPH.nodes.map(n => ({ data: {
      id: n.id, label: n.label, level: n.level ?? 0, source_ref: n.source_ref || "" } })),
    ...GRAPH.edges.map((e, i) => ({ data: {
      id: "e" + i, source: e.src, target: e.dst, kind: e.kind } })),
  ],
  style: [
    { selector: "node", style: {
        label: "data(label)", "text-wrap": "wrap", "text-max-width": "120px",
        "text-valign": "center", "background-color": "#4a7ebb", color: "#fff",
        "font-size": "11px", width: "label", height: "label",
        shape: "round-rectangle", padding: "8px" } },
    { selector: "node[level = 0]", style: { "background-color": "#2c4a72", "font-size": "14px" } },
    { selector: "edge", style: {
        "curve-style": "bezier", "target-arrow-shape": "triangle",
        width: 1.5, "line-color": "#999", "target-arrow-color": "#999" } },
    { selector: 'edge[kind != "part-of"]', style: {
        "line-style": "dashed", "line-color": "#cc8855", "target-arrow-color": "#cc8855" } },
    { selector: ".hidden", style: { display: "none" } },
  ],
});

function applyVisibility() {
  cy.nodes().forEach(n => n.toggleClass("hidden", !visible.has(n.id())));
  cy.layout({ name: "breadthfirst", directed: false, spacingFactor: 1.3,
              roots: cy.nodes('[level = 0]') }).run();
}

function collapseSubtree(id) {
  (childrenOf[id] || []).forEach(kid => { visible.delete(kid); collapseSubtree(kid); });
}

function toggle(id) {
  const kids = childrenOf[id] || [];
  if (kids.some(k => visible.has(k))) collapseSubtree(id);
  else kids.forEach(k => visible.add(k));
  applyVisibility();
}

cy.on("tap", "node", evt => {
  const d = evt.target.data();
  toggle(d.id);
  const kids = childrenOf[d.id] || [];
  document.getElementById("panel").innerHTML =
    `<h2>${d.label}</h2>
     <p class="muted">id: ${d.id}<br>level: L${d.level}<br>source: ${d.source_ref || "—"}</p>
     <p class="muted">${kids.length} sub-concept(s). Click again to collapse.</p>`;
});

applyVisibility();
</script>
</body>
</html>
