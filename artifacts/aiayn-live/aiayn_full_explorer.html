const PAGES = {"attention-mechanism": {"tldr": "<p>Attention is a mechanism that lets a model look up relevant information from a set of vectors by comparing a query against keys, then blending the associated values according to how well each key matches. It is the core building block that the Transformer's [[Encoder and Decoder Stacks]] rely on to move information between positions in a sequence.<\/p>", "intuition": "<p>Think of attention as a soft, differentiable lookup table: instead of retrieving a single exact match, the model retrieves a weighted average of everything in the table, where the weights reflect how relevant each entry is to the current query. This single idea underlies two concrete realizations used in the model — [[Scaled Dot-Product Attention]] as the specific compatibility function, and [[Multi-Head Attention]] as a way of running several such lookups in parallel — and is reused throughout the network in the [[Applications of Attention in the Model]].<\/p>", "mechanics": "<p>An attention function maps a query and a set of key-value pairs to an output, where the query, keys, values, and output are all vectors [§sec_3_2]. The output is not a single retrieved value but a weighted sum of all the values, so every value contributes in proportion to its relevance rather than only the single best match [§sec_3_2].<\/p>\n<p>The weight given to each value is not fixed — it is computed by a compatibility function that scores the query against the corresponding key [§sec_3_2]. This scoring step is what makes attention content-based: the same set of keys and values can produce very different outputs depending on what query is asked of them [§sec_3_2].<\/p>", "the-math": "<p>The local context describes attention only at this functional, conceptual level (query/key/value vectors in, weighted-sum vector out, weights from a compatibility function) without specifying the exact compatibility function or its formula [§sec_3_2]; the concrete scoring function (scaled dot-product) and its equation belong to [[Scaled Dot-Product Attention]] rather than this general definition.<\/p>", "go-deeper": "<p>No research note is available for this concept, so there are no additional resources to list beyond the paper's own definition in §3.2.<\/p>"}, "background-related-work": {"tldr": "<p>Before the Transformer, models trying to avoid step-by-step recurrence turned to convolutions instead, but paying a price: relating two positions in a sequence still took more operations the farther apart they were. This background sets up the problem the Transformer's design is meant to solve.<\/p>", "intuition": "<p>Recurrent models process a sequence one step at a time, so relating a token to one far earlier means passing information through every intervening step. Convolutional alternatives like Extended Neural GPU, ByteNet, and ConvS2S process all positions in parallel instead, which helps with computation but doesn't fully solve the distance problem: stacking enough convolutional layers to connect two distant positions still means the number of operations needed grows with how far apart they are. That growth makes it harder for the model to learn dependencies between distant positions. The Transformer, which this concept builds on, was designed to cut that cost down to a constant, regardless of distance.<\/p>", "mechanics": "<p>Extended Neural GPU, ByteNet, and ConvS2S all use convolutional neural networks as their basic building block, which lets them compute hidden representations for all input and output positions in parallel rather than sequentially [§sec_2]. However, relating signals from two arbitrary positions still requires a number of operations that grows with the distance between them: linearly for ConvS2S and logarithmically for ByteNet [§sec_2]. This growth makes learning dependencies between distant positions more difficult, since long-range signals must propagate through more computational steps to connect [§sec_2].<\/p>", "the-math": "<p>The local context does not provide explicit equations or complexity formulas for these models — it states the scaling behavior in words only (linear for ConvS2S, logarithmic for ByteNet), without derivation [§sec_2]. The Transformer counters this by reducing the operation count needed to relate any two positions to a constant, though this comes at the cost of reduced effective resolution from averaging attention-weighted positions, an effect addressed separately by Multi-Head Attention [§sec_2].<\/p>", "go-deeper": "<p>No research note is available for this concept, so there are no additional resources to summarize beyond the paper's own background section [§sec_2].<\/p>"}, "embeddings-softmax": {"tldr": "<p>This component turns discrete tokens into vectors the Transformer can compute with, and turns the model's final vectors back into a probability distribution over the vocabulary for predicting the next token. It's the \"translation layer\" at the entrance and exit of the Transformer.<\/p>", "intuition": "<p>Neural networks operate on continuous vectors, not words or symbols, so every token — whether it's an input word or an output word being generated — first needs to be mapped to a learned vector representation, called an embedding. At the other end of the model, after the decoder has produced its output, that vector needs to be converted back into a decision about which word comes next; a linear transformation followed by a softmax turns the decoder's output into a probability for every word in the vocabulary. This concept is the on-ramp and off-ramp for the whole Transformer architecture, sitting just outside the core attention machinery.<\/p>", "mechanics": "<p>The model uses learned embedding layers — essentially lookup tables — to convert both the input tokens and the output tokens into vectors of a fixed dimension, rather than using any hand-crafted or fixed encoding scheme [§sec_3_4]. At the output side, the decoder's final vectors are passed through a learned linear transformation and then a softmax function, which converts them into predicted probabilities over the next possible token [§sec_3_4]. A notable design choice is that the same weight matrix is reused in three places: the input embedding layer, the output embedding layer, and the pre-softmax linear transformation, tying these representations together rather than learning them separately [§sec_3_4].<\/p>", "the-math": "<p>In the embedding layers specifically, the shared weights are multiplied by a scaling factor before being used, a detail called out explicitly in this section though the precise constant depends on the model's embedding dimension [§sec_3_4]. Beyond this scaling step, the local text does not spell out the softmax formula itself or the loss computation that consumes these probabilities, so no further equations can be honestly attributed to this section.<\/p>", "go-deeper": "<p>No research note is available for this concept, so there are no external resources to list here.<\/p>"}, "encoder-decoder-stack": {"tldr": "<p>The Transformer's encoder and decoder are each built by stacking identical layers, with the encoder mapping the input sequence into a continuous representation and the decoder generating the output sequence from it, one position at a time. Both stacks are assembled from the same building blocks — self-attention and position-wise feed-forward sublayers — wrapped in residual connections and layer normalization so information and gradients flow cleanly through many stacked layers.<\/p>", "intuition": "<p>Think of the encoder as reading the entire input sentence and refining its understanding layer by layer, where each layer lets every word look at every other word (via attention) and then processes that information locally (via the feed-forward network). The decoder does something similar for the output it's generating, but with two twists: it can only look at output words it has already produced (it can't peek ahead), and it also gets to consult the encoder's finished understanding of the input via an extra attention step. This stacked, layered design is what lets the Transformer build up increasingly rich representations without recurrence, relying instead on attention and feed-forward transformations repeated many times.<\/p>", "mechanics": "<p>The encoder is composed of a stack of identical layers, and each layer has exactly two sub-layers: a multi-head self-attention mechanism, followed by a simple, position-wise fully connected feed-forward network [§sec_3_1]. Around each of these two sub-layers there is a residual connection followed by layer normalization, so the output of each sub-layer is LayerNorm(x + Sublayer(x)) [§sec_3_1]. To make these residual connections work, every sub-layer in the model, including the embedding layers, is constrained to produce outputs of the same dimension [§sec_3_1].<\/p>\n<p>The decoder is also composed of a stack of identical layers, but each decoder layer inserts a third sub-layer in addition to the two found in the encoder: a multi-head attention sub-layer that attends over the output of the encoder stack, letting the decoder condition its generation on the encoded input [§sec_3_1]. As in the encoder, each of the decoder's three sub-layers is wrapped with a residual connection and followed by layer normalization [§sec_3_1]. The decoder's self-attention sub-layer is additionally modified with masking to prevent positions from attending to subsequent positions [§sec_3_1].<\/p>", "the-math": "<p>Each sub-layer's output is defined as LayerNorm(x + Sublayer(x)), where Sublayer(x) is the function implemented by the sub-layer itself (self-attention, encoder-decoder attention, or the feed-forward network) [§sec_3_1]. This residual formulation is why every sub-layer output, and the embedding layers, must share the same dimension d_model — the addition x + Sublayer(x) only type-checks if both terms have matching shape [§sec_3_1]. The decoder combines this with output masking and a one-position offset of the output embeddings so that the prediction for position i depends only on known outputs at positions less than i, formalizing the auto-regressive property of generation [§sec_3_1].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so no external resources are available to cite here.<\/p>"}, "position-wise-ffn": {"tldr": "<p>Every layer in the Transformer's encoder and decoder stack contains a small feed-forward network applied independently to each position, sitting alongside the attention sub-layer as a core building block of the architecture.<\/p>", "intuition": "<p>Where attention lets positions exchange information with each other, this feed-forward step is the part of the layer where each position, on its own, gets to think. It runs the same transformation at every position, but that transformation differs from layer to layer, giving the model a per-position non-linear processing stage that complements attention's cross-position mixing. A related, more speculative framing treats these layers as performing attention over a fixed set of parameters rather than over the sequence itself.<\/p>", "mechanics": "<p>Each layer of the encoder and decoder applies this feed-forward network identically and separately to every position, in addition to the attention sub-layer, meaning the same function is computed at each position but no information is shared across positions within this sub-layer [§sec_3_3]. Structurally it consists of two linear transformations with a ReLU activation in between; the linear transformations share the same form across positions but use different learned parameters at each layer [§sec_3_3]. The authors note this is equivalent to describing the network as two convolutions with kernel size 1, which is just another way of expressing the position-wise, parameter-sharing-within-layer nature of the operation [§sec_3_3]. The input and output dimensionality is fixed at the model dimension, while the inner layer expands to a larger intermediate dimensionality before being projected back down [§sec_3_3].<\/p>", "the-math": "<p>The transformation applied at each position is the composition of two affine maps around a ReLU nonlinearity [eq_3]:<\/p>\n<p><span class=\"math\">$$\\mathrm{FFN}(x)=\\max(0, xW_1 + b_1) W_2 + b_2$$<\/span> [eq_3]<\/p>", "go-deeper": "<p>No research note is attached to this concept, so no additional resources are available beyond the paper text itself [§sec_3_3].<\/p>"}, "positional-encoding": {"tldr": "<p>Since the Transformer has no recurrence or convolution, it has no built-in sense of token order — attention alone treats a sequence like a bag of tokens. Positional encoding fixes this by adding a vector that encodes each token's position directly into its embedding before it enters the encoder and decoder stacks, giving the model access to sequence order without any architectural change.<\/p>", "intuition": "<p>Because the Transformer is part of a larger architecture built entirely from attention and feed-forward layers, order has to be smuggled in through the data rather than through the network structure. The trick is to give every position in the sequence its own unique \"fingerprint\" vector, sized to match the token embeddings, and simply add the two together. As long as each position's fingerprint is distinct and consistent, the model can learn to use it to infer relative or absolute position when computing attention.<\/p>", "mechanics": "<p>Positional encodings are added to the input embeddings at the bottom of both the encoder and decoder stacks, before any attention is computed, and share the same dimensionality as the embeddings so the two can simply be summed [§sec_3_5]. Many positional encoding schemes are possible, including learned embeddings, but this work uses a fixed, hand-designed function of sine and cosine waves at different frequencies [§sec_3_5]. The authors also trained a learned positional embedding variant and found it produced nearly identical results to the sinusoidal version, indicating the specific encoding scheme is not critical to performance [§sec_3_5].<\/p>", "the-math": "<p>The encoding for a token at position <code>pos<\/code> and embedding dimension <code>2i<\/code> (even index) is <code>sin(pos / 10000^{2i/d_model})<\/code>, and for dimension <code>2i+1<\/code> (odd index) it is <code>cos(pos / 10000^{2i/d_model})<\/code>, so each dimension of the positional vector traces a sinusoid and the wavelengths across dimensions form a geometric progression [eq_4]. This sinusoidal form was chosen because for any fixed offset <code>k<\/code>, <code>PE_{pos+k}<\/code> can be expressed as a linear function of <code>PE_{pos}<\/code>, which was hypothesized to make it easy for the model to learn to attend by relative position [§sec_3_5]. The sinusoidal choice was also preferred over learned embeddings because it may let the model extrapolate to sequence lengths longer than those seen during training [§sec_3_5].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to list here.<\/p>"}, "recurrent-models-limitation": {"tldr": "<p>Before the Transformer, state-of-the-art sequence models were recurrent — RNNs, LSTMs, and gated RNNs — which process a sequence one position at a time, carrying a hidden state forward from step to step. This step-by-step design is inherently sequential, so it cannot be parallelized within a single training example, and long sequences become expensive because memory limits how many examples can be batched together. The Transformer exists specifically to escape this constraint, replacing recurrence with an attention mechanism that draws global dependencies directly.<\/p>", "intuition": "<p>Imagine reading a sentence one word at a time, and being required to fully update your understanding after each word before you're allowed to look at the next one — you can never peek ahead or process two words simultaneously. That's the structural bottleneck of a recurrent model: computation is tied to position, and position <em>n<\/em> can't be computed until position <em>n-1<\/em> is done. It works, but it's slow to train, especially as sequences get longer, since you can't spread the work across a GPU's parallel cores within one example. This limitation is the direct motivation for the Transformer and for the broader case for self-attention as an alternative computational strategy.<\/p>", "mechanics": "<p>Recurrent models factor computation along the symbol positions of the input and output sequences, aligning positions to steps in computation time: at each step they generate a hidden state as a function of the previous hidden state and the input at that position [§sec_1]. This recurrence relation is what makes the models sequential by construction — each hidden state depends on the one before it, so the chain of computation cannot be broken apart and run concurrently [§sec_1].<\/p>\n<p>Because of this, the sequential nature \"precludes parallelization within training examples,\" and the problem intensifies at longer sequence lengths, since memory constraints then limit how much batching across examples can compensate [§sec_1]. Prior work had chipped away at the cost side of this problem — factorization tricks and conditional computation improved computational efficiency, and conditional computation also improved model performance — but these were mitigations, not a fix: \"the fundamental constraint of sequential computation, however, remains\" [§sec_1].<\/p>\n<p>Separately, attention mechanisms had already proven valuable for modeling dependencies regardless of their distance in a sequence, but in nearly all prior work they were used <em>bolted onto<\/em> a recurrent network rather than replacing it [§sec_1]. This sets up the Transformer's core move: keep the attention mechanism's ability to model long-range dependencies, but discard the recurrent backbone entirely [§sec_1].<\/p>", "the-math": "<p>The local context describes the recurrent formulation only qualitatively — hidden state h_t as a function of h_{t-1} and the input at position t — without giving an explicit equation in this section [§sec_1]. No further mathematical detail on recurrent computation (e.g., specific LSTM/GRU gating equations) is present in this local context, so none is included here.<\/p>", "go-deeper": "<ul>\n<li>No research note or additional resources are attached to this concept in the local context — none available beyond Section 1 of the paper itself.<\/li>\n<\/ul>"}, "training-regime": {"tldr": "<p>Training is the umbrella process by which the Transformer's parameters are learned: it covers how data is batched, what hardware and schedule the runs used, how the optimizer updates weights, and what regularization keeps the model from overfitting. Understanding this concept is a prerequisite for interpreting the paper's machine translation results, since those numbers are only meaningful in light of how the model was trained.<\/p>", "intuition": "<p>Think of Training as the \"recipe\" that turns the Transformer architecture into a working translation model — it's not one technique but a bundle of decisions (what data to feed it, in what groupings, on what hardware, for how long, with what safeguards against overfitting) that together determine whether the architecture actually learns. Each of its sub-topics — data/batching, hardware/schedule, the optimizer, and regularization — is a separate lever the authors pulled, and the reported translation quality is the joint outcome of all of them working together.<\/p>", "mechanics": "<p>The paper introduces this topic with a single framing sentence describing the training regime for the models, without yet specifying the concrete procedure [§sec_5].<\/p>\n<p>The regime is decomposed into further subsections — data and batching, hardware and schedule, the optimizer, and regularization — each of which supplies the operational detail; the local context for this section does not itself contain those details, only the pointer that they follow [§sec_5].<\/p>", "the-math": "<p>The local context for this section contains no equations — sec_5 is introductory text only, with any formal training objective or update rule presumably given in its subsections rather than here [§sec_5].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to list here.<\/p>"}, "self-attention-motivation": {"tldr": "<p>Self-attention was chosen over recurrent and convolutional layers because it connects every pair of positions in a sequence directly, making it cheaper to compute when sequences are shorter than the model's dimensionality, far more parallelizable, and much better at learning long-range dependencies. This is the core justification for building the Transformer entirely out of attention.<\/p>", "intuition": "<p>Recurrent networks process a sequence one step at a time, so information from the first word has to travel through every intermediate step before it can influence the last word — a long, sequential chain that makes long-range relationships hard to learn and impossible to parallelize across time. Self-attention instead lets every position look at every other position in a single step, collapsing that chain to a constant length. The tradeoff being weighed is essentially: how much work per layer, how much of that work can happen simultaneously, and how far a signal has to travel to connect two related words — self-attention wins on the latter two, which is why it replaces recurrence in the Transformer.<\/p>", "mechanics": "<p>The comparison is organized around three desiderata: total computational complexity per layer, the amount of computation that can be parallelized (measured by the minimum number of sequential operations required), and the path length that forward and backward signals must traverse between any long-range dependency in the network — shorter paths make such dependencies easier to learn [§sec_4].<\/p>\n<p>A self-attention layer connects all positions with a constant number of sequentially executed operations, whereas a recurrent layer requires a number of sequential operations proportional to sequence length; this is the key parallelization advantage of self-attention [§sec_4].<\/p>\n<p>For very long sequences, self-attention could be restricted to a neighborhood of size r around each output position to improve computational performance, at the cost of increasing the maximum path length between distant positions to O(n/r); this restricted variant was noted as future work rather than something evaluated in the paper [§sec_4].<\/p>\n<p>A single convolutional layer with kernel width k &lt; n does not connect all pairs of input and output positions, so a stack of O(n/k) contiguous convolutional layers (or O(log_k(n)) dilated convolutional layers) is required to do so, which lengthens the paths between positions compared to self-attention; convolutional layers are also generally more expensive than recurrent layers by a factor of k, though separable convolutions reduce this substantially [§sec_4].<\/p>\n<p>As a side benefit, self-attention was also observed to yield more interpretable models: individual attention heads appear to learn distinct tasks, with some exhibiting behavior tied to the syntactic and semantic structure of sentences [§sec_4].<\/p>", "the-math": "<p>Let n be the sequence length, d the representation dimension, k the kernel size of convolutions, and r the neighborhood size for restricted self-attention. The per-layer complexity, minimum sequential operations, and maximum path length for each layer type are: self-attention has complexity O(n²·d), O(1) sequential operations, and O(1) maximum path length; recurrent layers have complexity O(n·d²), O(n) sequential operations, and O(n) maximum path length; convolutional layers have complexity O(k·n·d²), O(1) sequential operations, and O(log_k(n)) maximum path length; restricted self-attention has complexity O(r·n·d), O(1) sequential operations, and O(n/r) maximum path length [§sec_4].<\/p>\n<p>Self-attention layers are faster than recurrent layers whenever the sequence length n is smaller than the representation dimensionality d, which the paper notes is most often the case for sentence representations used by state-of-the-art machine translation models (e.g., word-piece and byte-pair representations) [§sec_4].<\/p>\n<p>Even in the best case where k = n, a separable convolution's complexity is equal to the combination of a self-attention layer and a point-wise feed-forward layer — which is the approach the Transformer actually takes [§sec_4].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to summarize here — this page draws solely on the local section content (sec_4) and its comparison table. For broader context, see the neighboring concepts <strong>Recurrent Model Limitations<\/strong> (the contrasting baseline this section argues against) and <strong>Transformer<\/strong> (the architecture this justification builds on).<\/p>"}, "transformer": {"tldr": "<p>The Transformer is a neural sequence-to-sequence architecture that throws out recurrence and convolution entirely, relying only on attention mechanisms and feed-forward layers to map an input sequence to an output sequence. It follows the standard encoder-decoder structure used by competitive translation models, but replaces the RNN or CNN layers inside the encoder and decoder with stacks of self-attention and point-wise fully connected sublayers. Because attention lets any two positions in a sequence interact directly, the model can be trained with far more parallelism than recurrent architectures, while still producing strong results on tasks like machine translation and English constituency parsing.<\/p>", "intuition": "<p>Recurrent models process a sequence one token at a time, so information about a distant word has to flow step by step through every position in between before it can influence another distant word — this is slow to train and hard to parallelize. The Transformer's core idea is to let every position look directly at every other position through attention, cutting that long chain of sequential steps down to a single step. This is the architecture's answer to the sequential-computation bottleneck that motivated the design, and it stands in direct contrast to the way recurrent models are limited by their step-by-step processing. Since attention alone has no built-in sense of word order, positional information is added separately so the model still knows which token came first. The result is a general building block — encoder stack, decoder stack, embeddings, and positional encoding all composing together — that turned out to generalize well beyond translation, later becoming the backbone for models like BERT.<\/p>", "mechanics": "<p>Like other competitive sequence transduction models, the Transformer keeps the encoder-decoder shape: the encoder turns an input sequence of symbols into a sequence of continuous representations, and the decoder consumes those representations to generate an output sequence one symbol at a time, feeding each generated symbol back in as input for the next step (auto-regressive decoding) [§sec_3].<\/p>\n<p>What distinguishes the Transformer is that both halves are built entirely from stacked self-attention and point-wise, fully connected layers, with no recurrence or convolution anywhere in the architecture [§sec_3]. Because self-attention has no inherent notion of sequence order, the model injects order information through fixed sinusoidal positional encodings added to the input embeddings, allowing it to infer relative and absolute position from the resulting phase relationships [S1][S2]. This design is also what gives the Transformer its parallelization advantage over RNNs: self-attention connects any two positions in a constant number of sequential operations rather than the linear number an RNN needs, so all positions can be processed simultaneously during training [S1][S3].<\/p>\n<p>The encoder is a stack of 6 identical layers, each combining a multi-head self-attention sublayer with a position-wise feed-forward sublayer, both wrapped in residual connections and layer normalization [S1][S2]. The decoder mirrors this 6-layer structure but inserts a masked self-attention sublayer that prevents any position from attending to future tokens, plus a second multi-head attention sublayer that performs cross-attention over the encoder's output [S1][S2]. Multi-head attention itself works by running several scaled dot-product attention functions in parallel over projected subspaces, letting the model attend to different kinds of information at different positions simultaneously [S1][S3]. This encoder stack was later lifted directly as the backbone for bidirectional pretraining in BERT, showing the architecture's reach beyond the original translation task [S4].<\/p>", "the-math": "<p>The local context for this concept describes the architecture at a structural level (encoder-decoder shape, sublayer composition, positional encoding, multi-head attention) but does not include any [eq_N] equation entries to reproduce here — the specific formulas for scaled dot-product attention, multi-head projections, and the sinusoidal positional encoding live in the child concepts that implement these pieces [§sec_3].<\/p>", "go-deeper": "<ul>\n<li><strong>Attention Is All You Need (Vaswani et al., 2017)<\/strong> — the original paper, for the full architecture diagram, equations, and ablation studies behind every claim above. <a href=\"https://arxiv.org/abs/1706.03762\">https://arxiv.org/abs/1706.03762<\/a><\/li>\n<li><strong>The Illustrated Transformer<\/strong> — best starting point for building visual intuition on Q/K/V, multi-head attention, and how the encoder-decoder stacks fit together. <a href=\"https://jalammar.github.io/illustrated-transformer/\">https://jalammar.github.io/illustrated-transformer/<\/a><\/li>\n<li><strong>The Annotated Transformer<\/strong> — pairs a line-by-line PyTorch implementation with each paper equation, useful once you want to see the math turned into code. <a href=\"https://nlp.seas.harvard.edu/2018/04/03/attention.html\">https://nlp.seas.harvard.edu/2018/04/03/attention.html<\/a><\/li>\n<li><strong>BERT: Pre-training of Deep Bidirectional Transformers (Devlin et al., 2018)<\/strong> — shows how the encoder half of this architecture was repurposed for large-scale bidirectional pretraining. <a href=\"https://arxiv.org/abs/1810.04805\">https://arxiv.org/abs/1810.04805<\/a><\/li>\n<\/ul>"}, "machine-translation-results": {"tldr": "<p>On both WMT 2014 English-to-German and English-to-French translation benchmarks, the Transformer set a new state of the art while costing far less to train than prior architectures. This result is the empirical payoff of the Transformer's design: dropping recurrence in favor of attention doesn't just simplify the model, it also translates better and cheaper. The gains build directly on the Training setup and model architecture described elsewhere in the paper, and are corroborated by the Model Variations ablations, which show which architectural choices actually drove the improvement.<\/p>", "intuition": "<p>Prior best systems (ensembles of recurrent or convolutional seq2seq models) needed enormous compute to reach competitive BLEU scores. The Transformer's attention-only architecture parallelizes much better than recurrence, so it can reach higher quality using a small fraction of the training FLOPs previous state-of-the-art models required — and it does so with a single model, not an ensemble. The headline finding is simple: better translations, less compute, no ensembling tricks needed.<\/p>", "mechanics": "<p>Two model sizes were evaluated: a \"base\" Transformer and a larger \"big\" Transformer, following the training and architecture setup established earlier in the paper. For inference, the models used beam search with a fixed beam size and a length penalty, with maximum output length capped at input length plus a small constant, and early termination when possible; these decoding hyperparameters were tuned on the development set [§sec_6_1]. To produce the final reported models, checkpoints were averaged: the base model averaged its last 5 checkpoints (written at 10-minute intervals), while the big model averaged its last 20 checkpoints [§sec_6_1]. For the big English-to-French model specifically, a higher dropout rate was used than in the base configuration [§sec_6_1]. Training cost was estimated by multiplying training time, number of GPUs, and an estimated sustained single-precision FLOPS per GPU, giving the FLOPS figures used to compare against prior architectures like ByteNet, GNMT+RL, ConvS2S, and MoE [§sec_6_1].<\/p>", "the-math": "<p>The comparison metric throughout is BLEU score, reported per model per language pair alongside estimated training cost in FLOPs [§sec_6_1]. On English-to-German, the Transformer (big) achieves a new state-of-the-art BLEU score, surpassing all previously reported models and ensembles by more than 2 BLEU points, while the base model alone already exceeds all prior single models and ensembles at a fraction of their training cost [§sec_6_1]. On English-to-French, the Transformer (big) achieves a BLEU score outperforming every previously published single model, at less than 1/4 the training cost of the prior state-of-the-art [§sec_6_1]. The training-cost estimate itself is derived as time × GPU count × sustained FLOPS/GPU, which is how the paper puts the Transformer's cost figures on the same footing as ByteNet, Deep-Att+PosUnk, GNMT+RL, ConvS2S, and MoE in the results table [§sec_6_1].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to list here — the material above draws solely on §sec_6_1. For deeper context, see the neighboring concepts: <strong>Training<\/strong> (prerequisite — the optimizer, schedule, and regularization setup these results depend on), <strong>Transformer<\/strong> (the architecture whose design choices are being validated here), and <strong>Model Variations<\/strong> (the ablation study that isolates which architectural components contributed to these BLEU gains).<\/p>"}, "attention-applications": {"tldr": "<p>The Transformer doesn't use just one attention mechanism — it reuses multi-head attention in three distinct roles throughout the architecture: encoder-decoder attention, encoder self-attention, and decoder self-attention. Each role governs a different kind of information flow, and together they replace the recurrence and convolution used in prior sequence models.<\/p>", "intuition": "<p>Think of attention as a general-purpose \"lookup and blend\" operation, and the model as reusing that same operation in three different contexts depending on who is asking (the queries) and who is being consulted (the keys and values). When the decoder needs to consult the source sentence, it uses encoder-decoder attention. When any layer needs to relate different positions within its own sequence to build contextual representations, it uses self-attention. The decoder's version of self-attention has an extra constraint: since it generates output one token at a time, it must not be allowed to \"peek\" at future tokens it hasn't produced yet.<\/p>", "mechanics": "<p>In encoder-decoder attention layers, the queries come from the previous decoder layer, while the keys and values come from the output of the encoder, letting every decoder position attend over all positions of the input sequence — this mirrors the typical encoder-decoder attention mechanisms found in earlier sequence-to-sequence models [§sec_3_2_3].<\/p>\n<p>The encoder uses self-attention layers where the queries, keys, and values all originate from the same place: the output of the previous encoder layer. This means each position in the encoder can attend to all positions in the previous encoder layer, allowing full bidirectional context within the source sequence [§sec_3_2_3].<\/p>\n<p>The decoder also uses self-attention, but restricted so that each position can only attend to positions up to and including itself, preventing leftward information flow to preserve the auto-regressive property needed for generation [§sec_3_2_3].<\/p>", "the-math": "<p>The masking that enforces the decoder's auto-regressive constraint is implemented inside scaled dot-product attention itself, by setting all values in the softmax input that correspond to illegal (future) connections to negative infinity before the softmax is applied, so those positions receive zero attention weight [§sec_3_2_3].<\/p>", "go-deeper": "<p>No research note is available for this concept — the section above (sec_3_2_3) is the only local source used for this page.<\/p>"}, "constituency-parsing": {"tldr": "<p>English constituency parsing is one of two out-of-domain generalization tests for the Transformer (the other being translation), and the surprising result — a purely attention-based sequence model producing state-of-the-art parse trees with almost no task-specific tuning — is offered as evidence that Transformer works as a general-purpose architecture, not just a translation trick.<\/p>", "intuition": "<p>Constituency parsing means outputting a full syntactic tree for a sentence, and it's a much harder sequence-to-sequence target than translation: the output is long relative to the input, it must obey strict structural constraints (a well-formed tree), and, historically, generic recurrent sequence-to-sequence models had struggled to be competitive here, especially without huge amounts of training data. Testing the Transformer on this task is a way of asking \"does this architecture actually understand structure, or did it just get lucky on translation?\" Success here strengthens the paper's core claim about the Transformer, described elsewhere as a general building block.<\/p>", "mechanics": "<p>The model used is a 4-layer Transformer, notably smaller than the translation models described elsewhere in the paper, trained directly on parse trees as a sequence-to-sequence task [§sec_6_3]. It was trained in two regimes: WSJ-only, using about 40K labeled sentences from the Penn Treebank, and semi-supervised, using roughly 17M sentences drawn from larger high-confidence and BerkeleyParser corpora [§sec_6_3]. Vocabulary size was adapted to the setting — 16K tokens for WSJ-only, 32K tokens for semi-supervised — reflecting the larger and noisier data in the semi-supervised case [§sec_6_3].<\/p>\n<p>Critically, almost all hyperparameters were carried over unchanged from the base English-to-German translation model; the authors only tuned dropout (both attention and residual), learning rate, and beam size, using the Section 22 development set [§sec_6_3]. This minimal-tuning setup is itself part of the experimental point: strong results without task-specific architecture changes suggest the Transformer generalizes rather than overfitting to translation-specific tricks. At inference time, the maximum output length was extended relative to input length to accommodate the verbosity of tree notation, and beam search was used for both training regimes [§sec_6_3].<\/p>", "the-math": "<p>The local context provides no equations specific to parsing — the task reuses the Transformer's standard sequence-to-sequence formulation (encoder-decoder attention producing an output sequence, here a linearized parse tree) rather than introducing new mathematical machinery [§sec_6_3].<\/p>", "go-deeper": "<ul>\n<li>Table in §sec_6_3 — compares WSJ F1 scores across discriminative, semi-supervised, multi-task, and generative parsers (Petrov et al. 2006; Zhu et al. 2013; Dyer et al. 2016; Vinyals &amp; Kaiser et al. 2014; Luong et al. 2015), useful for seeing exactly where the Transformer (91.3 WSJ-only, 92.7 semi-supervised) lands relative to prior state of the art, including the one model it didn't beat (the Recurrent Neural Network Grammar, generative, 93.3).<\/li>\n<li>No dedicated research note exists for this concept — the section text above is the only available local material.<\/li>\n<\/ul>"}, "hardware-schedule": {"tldr": "<p>The Transformer wasn't just algorithmically efficient — it was also fast to train on real hardware. The authors trained on a single machine with 8 GPUs, and their base model reached its reported results in about half a day, while the larger, higher-capacity model took a few days. This was notably cheaper than the recurrent and convolutional architectures it was compared against, reinforcing the paper's central claim that self-attention is a more computationally efficient way to model sequences.<\/p>", "intuition": "<p>A model's quality is only half the story — how much compute it takes to get there matters just as much, especially when comparing architectures. By reporting concrete wall-clock numbers (GPU count, seconds per step, total steps, total time), the authors let readers judge the Transformer's training efficiency directly rather than trusting an abstract complexity argument alone. The base model's short training window (half a day) versus the big model's longer one (a few days) also illustrates the basic tradeoff explored elsewhere in the paper: a larger, more expressive model costs more compute and wall-clock time to train, in exchange for better final performance.<\/p>", "mechanics": "<p>Training was carried out on a single machine equipped with 8 NVIDIA P100 GPUs, rather than a distributed cluster [§sec_5_2]. Two training configurations were run on this hardware: the base model, using the hyperparameters described throughout the paper, and the big model, whose specific settings appear on the bottom line of the paper's configuration table [§sec_5_2]. Each configuration has a distinct per-step wall-clock cost — 0.4 seconds per training step for the base model versus 1.0 seconds per step for the big model — reflecting the larger model's greater computational cost per update [§sec_5_2]. The base model was trained for 100,000 steps, while the big model was trained substantially longer, for 300,000 steps, consistent with it needing more updates to converge given its larger capacity [§sec_5_2].<\/p>", "the-math": "<p>The reported total training durations follow directly from multiplying step count by per-step time. For the base model: 100,000 steps × 0.4 s/step = 40,000 seconds, reported by the authors as approximately 12 hours [§sec_5_2]. For the big model: 300,000 steps × 1.0 s/step = 300,000 seconds, reported as approximately 3.5 days [§sec_5_2]. These figures show that despite training for 3x as many steps at roughly 2.5x the per-step cost, the big model's total training time (~3.5 days) is only about 7x that of the base model (~12 hours) — a direct, if rough, illustration of the per-step-time × step-count relationship that determines total training cost on fixed hardware [§sec_5_2].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to summarize here. For further detail, consult Section 5.2 of \"Attention Is All You Need,\" which is the sole source for these hardware and schedule figures.<\/p>"}, "model-variations": {"tldr": "<p>To figure out which pieces of the Transformer actually matter, the authors ran a series of ablations on the base English-to-German model — tweaking one architectural knob at a time (number of attention heads, key/value dimensions, model size, dropout, and positional encoding scheme) and measuring the effect on translation quality. The results validate the core design choices behind the architecture: multi-head attention needs enough heads to be useful but not too many, richer key representations help, bigger models with proper regularization win, and the specific choice of sinusoidal vs. learned positional encodings barely matters. This builds directly on the main Machine Translation Results by explaining <em>why<\/em> the base and big configurations were chosen.<\/p>", "intuition": "<p>Think of this as the Transformer's sensitivity analysis: rather than just reporting one final score, the authors systematically dialed settings up and down to see what the model actually depends on. Some knobs turned out to be load-bearing (model size, dropout, attention key dimensionality), while others were largely cosmetic (the exact form of positional encoding). This kind of study is what separates a design choice that's \"just what we tried first\" from one that's actually justified by evidence.<\/p>", "mechanics": "<p>The experiments hold total computation roughly constant while varying architecture, using beam search but no checkpoint averaging, and report per-wordpiece perplexity and BLEU on the newstest2013 development set [§sec_6_2].<\/p>\n<p>Row group (A) varies the number of attention heads together with the per-head key/value dimensions so that total computation stays fixed; single-head attention scores 0.9 BLEU below the best multi-head setting, but performance also degrades when too many heads are used, indicating an interior optimum for the number of heads [§sec_6_2].<\/p>\n<p>Row group (B) shrinks the attention key size specifically, and quality drops as a result — the authors interpret this as evidence that compatibility between queries and keys is not trivial to compute, and that a more expressive compatibility function than the simple dot product could improve results [§sec_6_2].<\/p>\n<p>Row groups (C) and (D) confirm two expected trends: larger models (more layers/dimensions) consistently outperform smaller ones, and dropout is important for preventing overfitting, since removing it (dropout = 0.0) noticeably hurts perplexity and BLEU [§sec_6_2].<\/p>\n<p>Row (E) swaps the fixed sinusoidal positional encoding for learned positional embeddings, and the resulting BLEU (25.7) and train perplexity (4.92) are nearly identical to the base model, showing that this particular design choice is not critical to performance [§sec_6_2].<\/p>", "the-math": "<p>No new formulas are introduced here — this section is purely an empirical ablation table over the architecture defined elsewhere (base config: 6 layers, d_model=512, d_ff=2048, 8 heads, d_k=d_v=64, dropout=0.1, 100K training steps, ~65M params) [§sec_6_2]. The reported quantities are training perplexity per byte-pair-encoded wordpiece (not directly comparable to per-word perplexity) and BLEU on the dev set, alongside parameter counts, letting each row be read as a controlled trade-off between compute/capacity and translation quality [§sec_6_2].<\/p>", "go-deeper": "<p>No research note is attached to this concept; the only source material is the paper's own Section 6.2 (Model Variations) table and discussion, which is fully covered above [§sec_6_2].<\/p>"}, "adam-optimizer": {"tldr": "<p>The Optimizer is the training-time mechanism that updates the Transformer's weights during learning, sitting within the broader Training process for the model described in \"Attention Is All You Need.\" It governs how quickly and how stably the network converges as it learns to perform sequence transduction.<\/p>", "intuition": "<p>Think of the optimizer as the \"steering and throttle\" for training: it decides how big a step to take when adjusting weights after each batch, and how that step size should change over time. Early in training, small cautious steps help the model avoid instability while its internal representations are still poorly formed; later, steadily shrinking steps let it settle into a good solution rather than overshooting it. This scheduling behavior is what ties the Optimizer concept to the parent Training process — it's one of the key knobs that makes large-scale Transformer training actually work in practice.<\/p>", "mechanics": "<p>Training uses the Adam optimizer, configured with specific values, as described in the Optimizer section [§sec_5_3].<\/p>\n<p>Rather than holding the learning rate constant, the authors vary it over the course of training according to a schedule: the rate increases linearly for an initial number of warmup steps, then decreases proportionally to the inverse square root of the step number thereafter [§sec_5_3].<\/p>", "the-math": "<p>The learning rate schedule is given by [eq_5], which combines an inverse-square-root decay term with a linear warmup term, taking the minimum of the two scaled by the model dimensionality — so the rate rises during the warmup phase and falls afterward as training progresses [eq_5].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no additional resources to list here.<\/p>"}, "regularization": {"tldr": "<p>Regularization is the set of training-time techniques the Transformer uses to keep the model from overfitting and to make its predictions less overconfident. It sits within the broader Training process for the model.<\/p>", "intuition": "<p>A large sequence-to-sequence model with many parameters can easily memorize training data or become overly certain about its predictions, which hurts how well it generalizes to new sentences. Regularization counteracts this by injecting controlled noise into the network during training (so it can't rely too heavily on any single pathway) and by discouraging the model from assigning full probability mass to a single \"correct\" token. The result is a model that trains a bit less confidently but performs better on real translation tasks.<\/p>", "mechanics": "<p>The authors employ three types of regularization during training [§sec_5_4]. The first, Residual Dropout, is applied to the output of each sub-layer before it is added back to the sub-layer's input and normalized, meaning every attention and feed-forward sub-block has dropout applied right before its residual connection [§sec_5_4]. Dropout is additionally applied to the sums of the token embeddings and positional encodings in both the encoder and decoder stacks, so the very first representations entering the model are also regularized [§sec_5_4]. For the base model configuration, this dropout is applied at a specific rate [§sec_5_4].<\/p>", "the-math": "<p>The local context specifies the mechanism (dropout applied at sub-layer outputs and at the embedding+positional-encoding sums) and names a second technique, label smoothing, applied during training with a given smoothing value, but does not provide the underlying dropout or label-smoothing formulas or the base model's specific numeric hyperparameter values in this excerpt [§sec_5_4]. Label smoothing is noted to hurt perplexity, since it trains the model to be less certain about its outputs, while it improves accuracy and BLEU score [§sec_5_4].<\/p>", "go-deeper": "<p>No research note is available for this concept.<\/p>"}, "scaled-dot-product-attention": {"tldr": "<p>Scaled Dot-Product Attention is the core attention mechanism used in the Transformer: it scores how much each query should attend to each key via a dot product, scales that score down, and uses it to weight a sum of values. It is the fundamental building block that sits inside the broader Attention mechanism, and it is the specific function that Multi-Head Attention builds on by running many copies of it in parallel.<\/p>", "intuition": "<p>Think of each query as asking \"which of these keys are relevant to me?\" — the dot product measures similarity between the query and each key, producing a raw relevance score. Because these scores can grow very large when the vectors are high-dimensional, they are rescaled before being turned into a probability-like distribution over the values, so the mechanism reliably picks out the most relevant values without the scoring process becoming numerically unstable. This simple, matrix-multiplication-friendly design is what makes it a practical foundation for Attention, and why Multi-Head Attention can afford to stack many instances of it.<\/p>", "mechanics": "<p>The inputs are queries and keys of dimension $d_k$ and values of dimension $d_v$; for each query, the dot products are computed against all keys, each is divided by $\\sqrt{d_k}$, and a softmax is applied to obtain the weights placed on the values [§sec_3_2_1]. In practice this is computed for a whole set of queries at once by packing them into a matrix $Q$, with the keys and values likewise packed into matrices $K$ and $V$, so the entire operation reduces to matrix multiplications [§sec_3_2_1]. This is contrasted with additive attention, which computes the compatibility function using a feed-forward network with a single hidden layer, and with unscaled dot-product attention, which is identical except for the missing $\\sqrt{d_k}$ scaling factor [§sec_3_2_1]. Dot-product attention is much faster and more space-efficient than additive attention in practice because it can be implemented with highly optimized matrix multiplication code, even though the two have similar theoretical complexity [§sec_3_2_1]. For large $d_k$, the dot products grow large in magnitude and push the softmax into regions with extremely small gradients, which is why the scaling by $\\sqrt{d_k}$ is applied to counteract this effect [§sec_3_2_1].<\/p>", "the-math": "<p>The output of the attention function over the packed matrices is given by [eq_1]:<\/p>\n<p><span class=\"math\">$$\\mathrm{Attention}(Q, K, V) = \\mathrm{softmax}(\\frac{QK^T}{\\sqrt{d_k}})V$$<\/span> [eq_1]<\/p>", "go-deeper": "<p>There is no research note attached to this concept, so no external resources can be listed here.<\/p>"}, "multi-head-attention": {"tldr": "<p>Multi-Head Attention runs several attention operations side by side, each looking at the input through its own learned lens, then merges what they found into one representation. It is the mechanism that lets the Transformer's attention layers capture several different kinds of relationships between positions at once, rather than being limited to a single averaged view.<\/p>", "intuition": "<p>A single attention function forces the model to average over every relationship it might care about — syntax, coreference, position, topic — into one weighted combination, which blurs distinct signals together. Multi-Head Attention instead gives the model several independent \"heads,\" each free to specialize in its own representation subspace and its own notion of relevance between positions. Because it builds directly on Scaled Dot-Product Attention, running many smaller, cheaper versions of that same operation in parallel, it turns a single monolithic attention computation into a committee of narrower ones whose outputs are recombined. This parallel structure is also what makes attention patterns visualizable per head, since each head can be inspected separately for the distinct relationship it learned.<\/p>", "mechanics": "<p>Rather than performing attention once with full-dimensional queries, keys, and values, the queries, keys, and values are each linearly projected h times using separate learned projection matrices, producing lower-dimensional versions for each head [§sec_3_2_2]. Scaled Dot-Product Attention is then applied independently and in parallel to each of these h projected triples, yielding h separate output vectors [§sec_3_2_2]. The per-head outputs are concatenated and passed through one more learned linear projection to produce the final output values [§sec_3_2_2]. Because each head operates on a reduced dimension, running h heads in parallel costs about the same as one full-dimensionality single-head attention would, so the parallel-head design is not a computational tax on top of ordinary attention [§sec_3_2_2].<\/p>", "the-math": "<p>The overall operation concatenates the outputs of h attention heads and applies an output projection W^O, where each head_i is Scaled Dot-Product Attention computed on the query, key, and value matrices after they've been projected by that head's own learned matrices W^Q_i, W^K_i, W^V_i [eq_2]. This formalizes the mechanics above: the projections give each head its own subspace to attend within, the shared Attention(·) function does the actual weighting, and W^O fuses the h independent results back into a single output of model dimension [eq_2].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to summarize here. Within the paper's own concept graph, Multi-Head Attention builds on Scaled Dot-Product Attention (the per-head computation it parallelizes) and is part of the broader Attention concept; Attention Visualizations draws on this concept's per-head structure to show what individual heads learn to attend to.<\/p>"}, "training-data-batching": {"tldr": "<p>This concept covers the raw material and packaging strategy behind Transformer training: which parallel corpora were used, how text was tokenized into subword units, and how sentences were grouped into batches. It sits under the paper's broader Training section, describing the data pipeline that feeds the model before any optimization happens.<\/p>", "intuition": "<p>Before a model can learn to translate, it needs a large aligned corpus of source-target sentence pairs and a way to turn open-ended vocabulary into a fixed, manageable set of tokens — subword schemes like byte-pair encoding solve the rare-word problem by splitting uncommon words into common sub-pieces. Batching by sentence length rather than by a fixed sentence count is a practical efficiency trick: it keeps the amount of padding low and the number of real (non-padding) tokens per batch roughly constant, so each training step does a similar amount of useful work regardless of whether the sentences in it happen to be short or long.<\/p>", "mechanics": "<p>For English-German, training used the WMT 2014 English-German dataset (~4.5 million sentence pairs), encoded with byte-pair encoding over a vocabulary shared between source and target of about 37,000 tokens [§sec_5_1]. For English-French, a much larger corpus was used instead — the WMT 2014 English-French dataset with 36 million sentences — and tokens were split using a 32,000-token word-piece vocabulary rather than BPE [§sec_5_1]. Sentence pairs were not batched arbitrarily: they were grouped by approximate sequence length so that sentences of similar length end up in the same batch, and each training batch was sized to contain approximately 25,000 source tokens and approximately 25,000 target tokens, rather than a fixed number of sentences [§sec_5_1].<\/p>", "the-math": "<p>The local context for this concept contains no formal equations — only dataset and configuration statistics (4.5M / 36M sentence pairs, ~37,000 / 32,000-token vocabularies, and ~25,000 source/target tokens per batch) [§sec_5_1].<\/p>", "go-deeper": "<p>No research note is attached to this concept, so there are no external resources to list here.<\/p>"}, "attention-visualization": {"tldr": "<p>Attention visualizations are diagnostic plots that show, for a given word, how strongly each attention head attends to every other word in the sequence. They provide qualitative evidence that Multi-Head Attention learns interpretable structure — such as long-distance syntactic dependencies and coreference — rather than acting as an opaque black box.<\/p>", "intuition": "<p>Because each attention head produces a distribution of weights over all positions in a sentence, that distribution can be drawn directly as colored lines or highlights connecting a query word to the words it \"looks at.\" Different heads, shown in different colors, often specialize: one head might consistently jump across a long clause to link a verb with its dependent phrase, while another head sharpens its focus on pronouns to resolve what they refer to. This turns the abstract claim that attention \"learns relationships\" into something that can be inspected by eye, head by head.<\/p>", "mechanics": "<p>One visualization example examines encoder self-attention at layer 5 of 6, focusing on attentions from the word \"making.\" Many attention heads are shown attending to a distant dependency of \"making,\" completing the phrase \"making...more difficult\" — demonstrating that the model captures long-distance dependencies rather than only local, nearby-word relationships [§sec_8].<\/p>\n<p>A second example, also from layer 5 of 6, isolates two attention heads (heads 5 and 6) whose behavior appears related to anaphora resolution. The figure contrasts the full attention pattern of head 5 with the isolated attentions from just the word \"its\" for heads 5 and 6, noting that these attentions are very sharp for that word — i.e., concentrated on a small number of positions rather than spread diffusely [§sec_8].<\/p>\n<p>Across both examples, the broader observation is that many attention heads exhibit behavior tied to the syntactic and semantic structure of the sentence, and that different heads from the same encoder self-attention layer clearly learn to perform different tasks [§sec_8].<\/p>", "the-math": "<p>The local context for this concept describes qualitative visualization examples and contains no equations; the underlying attention-weight computation these visualizations plot belongs to the Multi-Head Attention concept rather than to this note. [§sec_8]<\/p>", "go-deeper": "<ul>\n<li>No research note is available for this concept — the local context above (Section sec_8, the paper's attention visualization figures) is the only source material provided.<\/li>\n<\/ul>"}, "ffn-as-attention": {"tldr": "<p>The Transformer's position-wise feed-forward networks can be reinterpreted as a special case of attention: instead of attending over a sequence of activations, they \"attend\" over fixed, trainable parameter matrices that act as keys and values, with ReLU standing in for softmax. This reframing lets the two mechanisms — feed-forward and attention — be swapped for each other, and experiments show that replacing the feed-forward sublayer with real multi-head attention over trainable key/value parameters gives roughly the same translation quality.<\/p>", "intuition": "<p>A position-wise feed-forward network, which builds on the standard Position-wise Feed-Forward Networks used throughout the Transformer, expands each token's representation with one matrix, applies a nonlinearity, then compresses it back down with a second matrix. Ordinary attention does something structurally similar: it compares a query against a set of keys, turns the comparison scores into weights, and uses those weights to combine a set of values. The insight here is that the two computations line up almost exactly if you treat the rows of the feed-forward network's first weight matrix as \"keys,\" the rows of its second weight matrix as \"values,\" and replace the softmax weighting with a ReLU. Under this lens, a feed-forward layer isn't a fundamentally different tool from attention — it's attention where the \"memory\" being attended to is a fixed, learned set of parameters rather than the other tokens in the sequence.<\/p>", "mechanics": "<p>The comparison starts from the standard feed-forward formula, two linear transformations with a ReLU in between, set side by side with the formula for simple dot-product attention with biases and scaling omitted [eq_6]. Matching the two formulae term by term, the rows of the trainable matrices $W_1$ and $W_2$ play the role of keys and values respectively, and ReLU substitutes for the softmax compatibility function [§sec_9]. Motivated by this parallel, the authors built an actual multi-head-attention-over-parameters sublayer: it is identical to ordinary multi-head attention, except that the \"keys\" and \"values\" fed into each head are trainable parameters rather than projections of the previous layer's activations, and these parameter values are scaled up so their magnitude resembles that of real activations [§sec_9]. Two configurations were tested, one with $h=8$ heads, $d_k=d_v=64$, and 64 key-value pairs per head, and another with $h=16$ heads and $d_k=d_v=64$ with only 32 key-value pairs per head; both were sized to match the parameter count of the base model's feed-forward sublayer [§sec_9]. On the English-to-German newstest2013 development set, the 8-head configuration scored slightly worse than the base model (PPL 4.92, BLEU 25.5 vs. base BLEU 25.8), while the 16-head configuration scored slightly better, but training step time grew about 30% longer in the attention version despite matching theoretical compute [§sec_9].<\/p>", "the-math": "<p>The core algebraic move is a direct comparison of the two sublayer formulas: $\\mathrm{FFN}(x, W_1, W_2) = \\mathrm{ReLU}(xW_1)W_2$ against $A(q, K, V) = \\mathrm{Softmax}(qK^T)V$ [eq_6]. In both, an input vector is first compared against a bank of vectors ($W_1$'s rows, or $K$) to produce a set of scores, those scores are passed through a nonlinearity (ReLU vs. Softmax), and the result is used to linearly combine a second bank of vectors ($W_2$'s rows, or $V$) [§sec_9]. The parameter count of the resulting attention-over-parameters sublayer, including its query and output projections, was set to exactly match the position-wise feed-forward network it replaced, which is why the two experimental configurations vary $h$, $d_k$/$d_v$, and the number of key-value pairs against each other while holding total parameters fixed [§sec_9]. The local context also derives the scaling justification used elsewhere in attention — for independent random vectors $\\vec{u}, \\vec{v}$ with zero mean and unit variance, $E[\\langle \\vec{u}, \\vec{v}\\rangle] = 0$ [eq_7] and $\\mathrm{Var}(\\langle \\vec{u}, \\vec{v}\\rangle) = d_k$ [eq_8] — which is why dot products are divided by $\\sqrt{d_k}$; this variance argument is the same normalization logic that motivates scaling up the trainable parameter values in the attention-over-parameters sublayer so they resemble real activations [§sec_9].<\/p>", "go-deeper": "<p>No research note is attached to this concept; the discussion above draws entirely on §sec_9 of the paper itself, which is the primary source for both the FFN/attention formula comparison and the attention-over-parameters experiments.<\/p>"}};
const TIER_ORDER = ["tldr", "intuition", "mechanics", "the-math", "go-deeper"];
const TIER_LABEL = {"tldr": "TL;DR", "intuition": "Intuition",
                    "mechanics": "Mechanics", "the-math": "The Math",
                    "go-deeper": "Go Deeper"};

function renderTiers(id) {
  const tiers = PAGES[id];
  if (!tiers) return "";
  let html = "";
  TIER_ORDER.forEach(t => {
    if (tiers[t]) html += `<details ${t === "tldr" ? "open" : ""}>` +
      `<summary>${TIER_LABEL[t]}</summary><div class="tier">${tiers[t]}</div></details>`;
  });
  return html;
}

function typeset(container) {
  if (typeof katex === "undefined") return;
  container.querySelectorAll(".math").forEach(el => {
    const text = el.textContent.trim();
    const inline = text.startsWith("\\(") && text.endsWith("\\)");
    const display = text.startsWith("$$") && text.endsWith("$$");
    const expression = inline || display ? text.slice(2, -2).trim() : text;
    try {
      katex.render(expression, el,
                   display ? {throwOnError: false, displayMode: true}
                           : {throwOnError: false});
    }
    catch (e) { /* leave source text visible */ }
  });
}

function focusNode(id) {
  revealAncestors(id);
  applyVisibility();
  const node = cy.getElementById(id);
  cy.animate({ center: { eles: node }, duration: 200 });
  node.select();
  showDetail(id);
}

cy.on("tap", "node", evt => { toggle(evt.target.id()); showDetail(evt.target.id()); });

document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.toLowerCase().trim();
  if (!q) return;
  const hit = GRAPH.nodes.find(n => n.label.toLowerCase().includes(q));
  if (hit) focusNode(hit.id);
});

const ol = document.getElementById("path");
READING_PATH.forEach(step => {
  const li = document.createElement("li");
  li.textContent = step.label;
  li.onclick = () => focusNode(step.id);
  ol.appendChild(li);
});

applyVisibility();
</script>
</body>
</html>
