concept: cifar10-analysis
status: complete
synthesis: 'On CIFAR-10, plain (non-residual) networks show the same degradation problem
  seen on ImageNet: a deeper plain network has higher training error than a shallower
  one, confirming the issue is not dataset-specific [S1]. He et al. pushed residual
  networks on CIFAR-10''s 50k/10k split up to 1202 layers and were still able to optimize
  them, reaching training error comparable to a much shallower 110-layer ResNet, showing
  shortcut connections keep extremely deep nets trainable [S1]. Despite similar training
  error, the 1202-layer network''s test error was worse than the 110-layer network''s;
  the authors attribute this to overfitting from the model''s huge capacity relative
  to CIFAR-10''s small size, noting they used no heavy regularization like maxout
  or dropout and that such techniques might close the gap [S1]. The official released
  prototxt configs include the exact 110- and 1202-layer CIFAR-10 architectures used
  in these experiments [S2]. Stanford''s CS231n lecture on CNN architectures situates
  this ultra-deep CIFAR-10 result within the broader discussion of depth versus optimizability
  [S3], and community write-ups reproduce the training/test error curves that illustrate
  the degradation-then-overfitting pattern [S4].'
resources:
- url: https://arxiv.org/abs/1512.03385
  title: Deep Residual Learning for Image Recognition
  type: derivation
  why: Section 4.2 contains the actual CIFAR-10 experiments, including the 110- and
    1202-layer results and the overfitting discussion
- url: https://github.com/KaimingHe/deep-residual-networks
  title: KaimingHe/deep-residual-networks
  type: reference-impl
  why: official repo with Caffe prototxts for the exact CIFAR-10 architectures including
    the 1202-layer network
- url: https://www.youtube.com/watch?v=DAOcjicFr1Y
  title: 'CS231n Lecture 9: CNN Architectures'
  type: lecture
  why: Stanford lecture walks through ResNet's depth experiments and why very deep
    plain nets degrade
- url: https://towardsdatascience.com/an-overview-of-resnet-and-its-variants-5281e2f56035
  title: An Overview of ResNet and its Variants
  type: visual
  why: diagrams the residual block and depth-vs-error curves that make the degradation/overfitting
    pattern easy to see
unresolved:
- Whether the authors or follow-up work later tested dropout/maxout on the 1202-layer
  CIFAR-10 network to see if it closed the gap with the 110-layer network
- Whether the overfitting explanation for 1202 layers was ever rigorously separated
  from an optimization-difficulty explanation
sources_consulted:
  S1: He, Zhang, Ren, Sun, 'Deep Residual Learning for Image Recognition', arXiv:1512.03385
  S2: https://github.com/KaimingHe/deep-residual-networks
  S3: 'Stanford CS231n Lecture 9: CNN Architectures, https://www.youtube.com/watch?v=DAOcjicFr1Y'
  S4: https://towardsdatascience.com/an-overview-of-resnet-and-its-variants-5281e2f56035
