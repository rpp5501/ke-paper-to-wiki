status: verified
date: '2026-08-04'
synthesis: Paper-wide terminology for arXiv:1306.1043 (Peters & Buhlmann, Structural
  Intervention Distance). Terms here hover on every concept page; a concept that defines
  the same term more precisely overrides this entry.
glossary:
  DAG: 'Directed acyclic graph: nodes joined by arrows with no directed cycle. The
    object SID compares.'
  CPDAG: 'Completed partially directed acyclic graph: represents a whole Markov equivalence
    class at once, so some edges stay undirected because the data cannot orient them.'
  PDAG: Partially directed acyclic graph, allowing both directed and undirected edges.
    SHD is defined over these, which is why it covers DAGs as a special case.
  d-separation: A purely graphical test for whether conditioning on a set blocks every
    path between two nodes. Blocks chains and forks at a conditioned node, and opens
    a collider when the collider or one of its descendants is conditioned on.
  collider: A node with two arrowheads into it on a path. Blocked by default, and
    opened by conditioning on it or on any of its descendants -- the reverse of every
    other node's behaviour.
  Markov: A distribution is Markov with respect to a graph when the graph's d-separations
    imply the distribution's conditional independences. SID scores correctness over
    the whole class of distributions Markov to the true DAG.
  intervention distribution: The distribution of one variable when another is set
    by intervention rather than observed, written p(y | do(X = x)). What SID compares,
    in place of edges.
  adjustment set: A set of variables to condition on so an intervention distribution
    can be computed from observational data. SID uses the estimated graph's parent
    set by default.
  parent set: The direct causes of a node in a graph. Always a valid adjustment set
    in the graph it comes from, which is why SID uses it -- it is cheap and local.
  mediator: A node on a directed path between the intervened node and the target.
    Adjusting for one, or for its descendants, destroys the effect being measured
    -- condition (a) of the adjustment criterion.
  pre-metric: 'Satisfies non-negativity and identity but not symmetry. SID is one:
    swapping the true and estimated graph can change the value.'
  idempotence: Applying an operation twice changes nothing after the first time. Path-matrix
    squaring reaches this once the closure is complete, which is why a bounded number
    of squarings suffices.
  transitive closure: 'The reachability relation: an entry is true when a directed
    path exists, not just an edge. Computed by repeated squaring of the adjacency
    matrix.'
  SHD: 'Structural Hamming Distance: counts the variable pairs whose edge type differs
    between two graphs. The edge-counting baseline SID is contrasted against.'
  Markov equivalence class: The set of DAGs implying exactly the same conditional
    independences, and so indistinguishable from observational data alone. Summarised
    by a CPDAG.
  SID: 'Structural Intervention Distance: a metric for comparing an estimated causal
    graph to a true graph by counting, for each ordered pair of variables, whether
    the adjustment set implied by the estimated graph correctly predicts the interventional
    distribution under the true graph. It is proposed as an alternative to edge-counting
    metrics like SHD because it directly measures causal-inference correctness rather
    than structural similarity.'
  adjustment-set: A set of variables (typically a node's parents) used to block confounding
    paths between a source and target so that conditioning on it yields the correct
    interventional distribution via the back-door criterion. SID is built on adjustment
    sets derived from an estimated graph's parent sets and checked against the true
    graph's paths.
  SEM: 'Structural Equation Model: a system of equations, one per variable, expressing
    each as a function of its parents plus independent noise. The paper uses linear
    Gaussian SEMs to attach concrete causal effects to a DAG so that intervention
    predictions can be computed and used to test adjustment sets in SID.'
  causal-effect: The change in a target variable's distribution induced by intervening
    on (setting) another variable, as opposed to merely observing it. SID's score
    is the count of pairs whose causal-effect prediction, computed from the estimated
    graph's adjustment set, disagrees with the true graph.
  non-causal: Describes a path between two nodes that is not a directed causal route
    from source to target (e.g., a path running through a common cause). A valid adjustment
    set must block every such non-causal path while leaving the true causal path open.
  PC: The PC-algorithm, a constraint-based causal discovery method that outputs a
    CPDAG (a Markov equivalence class of DAGs) rather than a single DAG, since equivalence
    classes are all that the observational distribution alone can identify.
  GES: Greedy Equivalence Search, a score-based causal discovery algorithm that, like
    the PC-algorithm, returns a CPDAG (Markov equivalence class) instead of a single
    DAG.
  back-door: 'The back-door path/criterion from causal inference: a non-causal path
    between source and target running through a common ancestor, which a valid adjustment
    set must block. In SID, a matching parent set between estimated and true graphs
    automatically satisfies this criterion.'
  causal-discovery: The task of learning a causal graph's structure from data (e.g.,
    using the PC-algorithm or GES). The paper discusses how SID and related metrics
    are used to evaluate and score the output of causal-discovery methods.
  edit-distance: A distance measure defined by the minimum number of elementary edit
    operations (e.g., edge insertions, deletions, reversals) needed to transform one
    object into another. The paper characterizes SHD as this kind of edge-based edit-distance
    metric, contrasted with SID's intervention-based comparison.
  non-descendant: A node that cannot be reached from another node via any directed
    path. Intervening on a non-descendant of Y (such as a parent of Y) cannot alter
    Y's distribution, since observational and interventional distributions coincide
    for non-descendants.
  non-directed: Describes a path between two nodes that is not a directed path from
    source to target. A valid adjustment set must block every such non-directed path
    between source and target without itself lying on the directed causal path.
  parent-set: The set of a node's direct parents (immediate causes) in a graph. SID
    uses an estimated graph's parent-set for a given source node as the candidate
    adjustment set to test against the true graph.
