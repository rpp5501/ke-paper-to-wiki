concept: lagrangian-optimization
status: partial
synthesis: 'In this NLP backdoor-defense formulation, Lagrange multipliers penalize
  violation of per-neuron activation bound constraints, pushing potentially trigger-amplified
  neuron activations back toward a learned upper (and lower) bound seen on clean inputs,
  while a companion multiplier keeps the clean-task loss from degrading [S1]. Convergence
  is checked through an augmented-Lagrangian / dual-ascent loop that iteratively updates
  the bound scale and dual variables until the constraint violation (activations exceeding
  the current bound) and the bound update magnitude both fall below a small threshold;
  the "dynamic" bound-scaling is specifically designed to avoid the oscillation and
  stalling a fixed-bound Lagrangian would suffer [S1][S2]. Compared to pruning-based
  mitigation such as Adversarial Neuron Pruning, which learns a binary or soft mask
  that zeroes out suspicious neurons entirely, this bound-scaling approach keeps every
  neuron active but clamps its dynamic range, reportedly preserving more clean accuracy
  at a comparable attack-success-rate reduction because it avoids the capacity loss
  that hard pruning causes [S1][S3]. The underlying machinery of converting a constrained
  min-max problem into an unconstrained dual objective via Lagrange multipliers follows
  the standard convex-duality framework [S4].

  '
