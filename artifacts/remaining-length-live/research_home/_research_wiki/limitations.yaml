concept: limitations
status: complete
synthesis: 'A linear probe only shows that a quantity is linearly decodable from the
  residual stream; decodability is a claim about information geometry, not about whether
  the forward pass reads and uses that subspace to produce output [S1]. Confounds
  include correlated surface cues (token count, punctuation density, positional statistics)
  that a probe can latch onto instead of a true length representation, and probe expressivity
  itself, since a powerful enough probe can extract structure the network encodes
  only as an incidental byproduct of unrelated computation [S1]. Establishing causal
  use instead requires an intervention: ablating, patching, or editing the identified
  subspace and checking whether generation changes as predicted, the approach used
  in causal tracing to localize factual associations in GPT rather than merely detect
  them [S2][S3]. A control task (a probe trained on a shuffled or randomized target)
  is the standard way to check a probe isn''t simply memorizing [S1]. Absent such
  interventions, a successful probe on a length estimate is consistent with, but does
  not demonstrate, causal reliance on that estimate during generation.'
