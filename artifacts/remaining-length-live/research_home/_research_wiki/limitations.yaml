  anchor: the entries for "Probing" and "Activation Patching"/"Causal Intervention"
- url: https://arxiv.org/abs/2202.05262
  title: Meng et al., "Locating and Editing Factual Associations in GPT" (ROME)
  type: follow-up-paper
  why: 'Concrete worked example of what a causal (not correlational) demonstration
    looks like: causal tracing plus an edit that changes model output'
  anchor: §3, the Causal Tracing methodology, and the intervention/editing results
    in §4
