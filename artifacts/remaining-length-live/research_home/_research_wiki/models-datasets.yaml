concept: models-datasets
status: partial
synthesis: 'The evaluation compares three open-weight, instruction-tuned models in
  the 7-8B parameter band: Meta''s Llama-3.1-8B-Instruct [S1][S4], Mistral AI''s Mistral-7B-Instruct-v0.3
  [S2], and AI2''s Olmo-3-7B-Instruct [S3]. Restricting to this size keeps inference
  tractable on a single research GPU while still capturing models capable of complex
  instruction-following, and all three ship fully open weights with documented training/instruction-tuning
  recipes, which is why they are favored over closed API-only models for probing internal
  or behavioral properties [S1][S2][S3]. Prior comparative work on similarly-sized
  instruction-tuned checkpoints (Mistral-7B vs. Llama-2-7B) shows that model family
  and instruction-tuning recipe produce measurably different behavior even at matched
  parameter counts, which motivates comparing multiple checkpoints rather than relying
  on a single model [S5]. The specific datasets or prompt domains used to elicit the
  completions being probed are not established by these background sources and should
  be confirmed directly from the paper''s methods section.'
