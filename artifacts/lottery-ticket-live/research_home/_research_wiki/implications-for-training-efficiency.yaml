concept: implications-for-training-efficiency
status: complete
synthesis: 'The lottery ticket hypothesis shows that small, sparse subnetworks found
  via iterative magnitude pruning can match full-network accuracy when trained from
  their original initialization, suggesting overparameterization''s main benefit may
  be giving SGD many chances to land on a well-initialized subnetwork rather than
  being intrinsically required for learning [S1]. This connects to older pruning literature:
  Zhou et al. found that even the sign pattern of a winning ticket''s initial weights,
  without any weight training at all, encodes a ''supermask'' that performs far above
  chance, implying structure and sign matter as much as the learned magnitudes [S2].
  Liu et al. complicate the efficiency story, showing that for many pruned architectures,
  training from a fresh random initialization matches or beats fine-tuning the inherited
  ''winning'' weights, suggesting the discovered architecture may matter more than
  the specific initialization values it came with [S3]. Frankle et al. directly test
  whether winning tickets can be found cheaply before training finishes, and show
  that fast saliency-based criteria like SNIP and GraSP largely fail to match iterative-magnitude-pruning
  tickets at higher sparsities, so using this insight to make training itself cheaper
  remains an open problem rather than a solved shortcut [S4].'
resources:
- url: https://www.uber.com/blog/deconstructing-lottery-tickets/
  title: 'Deconstructing Lottery Tickets: Zeros, Signs, and the Supermask'
  type: visual
  why: Shows with figures that the sign pattern of a winning ticket's initialization
    alone can act as a mask that performs well untrained, visualizing why overparameterized
    init may matter more than its exact values
  anchor: the visualizations of sign-based supermasks and the accuracy-vs-sparsity
    plots comparing masking criteria
- url: https://arxiv.org/abs/1803.03635
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: derivation
  why: The source paper defining winning tickets and the iterative magnitude pruning
    procedure, with its own discussion of what this implies for efficient training
    and network design
  anchor: the iterative pruning algorithm description and the concluding discussion
    of implications for training efficiency
- url: https://arxiv.org/abs/1810.05270
  title: Rethinking the Value of Network Pruning
  type: follow-up-paper
  why: Directly tests whether the pruned architecture or the inherited winning-ticket
    initialization drives the efficiency gains, complicating the overparameterization
    story
  anchor: the experiments comparing training a pruned architecture from a fresh random
    init versus fine-tuning the original winning-ticket weights
- url: https://arxiv.org/abs/2009.08576
  title: 'Pruning Neural Networks at Initialization: Why Are We Missing the Mark?'
  type: follow-up-paper
  why: Tests the sub-question of whether winning tickets can be identified cheaply
    before/at initialization to make training itself faster, and finds current cheap
    criteria fall short
  anchor: the experiments comparing SNIP/GraSP-style pruning-at-initialization criteria
    against iterative-magnitude-pruning winning tickets across sparsities
unresolved:
- Whether winning tickets can be found before or early in training, cheaply enough
  to actually reduce training cost, is still unresolved [S4]
- Whether it is the discovered sparse architecture or the specific inherited initialization
  values that matters more for trainability is debated between [S2] and [S3]
sources_consulted:
  S1: 'Frankle, J. & Carbin, M. (2019). The Lottery Ticket Hypothesis: Finding Sparse,
    Trainable Neural Networks. arXiv:1803.03635'
  S2: 'Zhou, H., Lan, J., Liu, R., & Yosinski, J. (2019). Deconstructing Lottery Tickets:
    Zeros, Signs, and the Supermask. Uber AI blog / arXiv:1905.01067'
  S3: Liu, Z., Sun, M., Zhou, T., Huang, G., & Darrell, T. (2019). Rethinking the
    Value of Network Pruning. arXiv:1810.05270
  S4: 'Frankle, J., Dziugaite, G.K., Roy, D.M., & Carbin, M. (2021). Pruning Neural
    Networks at Initialization: Why Are We Missing the Mark? arXiv:2009.08576'
