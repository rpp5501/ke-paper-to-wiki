concept: fc-lenet-mnist-experiments
status: complete
synthesis: Frankle & Carbin's original lottery ticket hypothesis paper trains a fully-connected
  LeNet-300-100 network on MNIST and shows that iterative magnitude pruning (IMP)
  can find winning tickets down to roughly 3.6% of the original weights that train
  as fast or faster than the unpruned network and reach the same or higher test accuracy
  [S1]. As sparsity increases beyond that point, winning-ticket accuracy degrades
  and eventually falls below the full network's [S1]. When the same sparse masks are
  kept but weights are randomly reinitialized, the resulting subnetworks learn more
  slowly and reach lower accuracy than winning tickets, showing that the specific
  initialization, not just the mask, matters [S1]. Follow-up analysis of these FC
  LeNet tickets found that the sign pattern of the pruned weights at initialization
  carries most of the benefit [S2], and that IMP outcomes can be unstable to SGD noise,
  motivating rewinding to an early training iteration rather than to iteration 0 to
  stabilize ticket discovery [S3].
resources:
- url: https://arxiv.org/abs/1803.03635
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: derivation
  why: primary source for the FC LeNet-300-100 MNIST experiments, including sparsity-vs-accuracy
    curves and the random reinitialization control
  anchor: Section 2 and Figure 3, the LeNet-300-100 on MNIST results
- url: https://www.uber.com/blog/deconstructing-lottery-tickets/
  title: 'Deconstructing Lottery Tickets: Zeros, Signs, and the Supermask'
  type: visual
  why: gives visual diagrams of pruning masks and shows the sign pattern of winning-ticket
    weights on the same MNIST/LeNet setup
  anchor: the section with mask and sign visualizations for the FC LeNet MNIST experiments
- url: https://arxiv.org/abs/1903.01611
  title: Stabilizing the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: explains why naive IMP can be unstable and introduces rewinding, directly relevant
    to reproducing the FC LeNet MNIST results reliably
  anchor: §4, the small-scale MNIST/LeNet stability experiments
unresolved:
- How consistent are the winning-ticket masks found by IMP across different random
  seeds on the FC LeNet-300-100/MNIST setup without rewinding?
sources_consulted:
  S1: 'Frankle, J. & Carbin, M. (2018). The Lottery Ticket Hypothesis: Finding Sparse,
    Trainable Neural Networks. arXiv:1803.03635'
  S2: 'Zhou, H., Lan, J., Liu, R., Yosinski, J. (2019). Deconstructing Lottery Tickets:
    Zeros, Signs, and the Supermask. Uber Engineering Blog. https://www.uber.com/blog/deconstructing-lottery-tickets/'
  S3: Frankle, J. et al. (2019). Stabilizing the Lottery Ticket Hypothesis. arXiv:1903.01611
