concept: limitations-scope
status: partial
synthesis: 'The original lottery ticket hypothesis paper explicitly restricts its
  claims to vision classification on MNIST (a fully-connected LeNet) and CIFAR10 (VGG/ResNet-style
  CNNs), and does not test larger datasets, larger models, or non-vision tasks [S1].
  A direct follow-up shows that the simple ''rewind to iteration 0'' pruning procedure
  fails to find winning tickets at ResNet-50/ImageNet scale, and only succeeds once
  learning-rate warmup and other stabilizing changes are added [S2]. Later work found
  that even those fixes break down for the largest models and instead proposed rewinding
  weights to an early training iteration k, rather than to initialization, to keep
  pruned networks in a stable, linearly-connected optimization basin [S3]. Together
  these follow-ups partially answer the paper''s own open question: winning tickets
  do exist beyond MNIST/CIFAR10, but the pruning-and-rewind recipe must be modified,
  not just re-applied, as scale grows [S2][S3]. Non-vision domains such as NLP and
  RL were not addressed by these specific follow-ups and remain a genuinely open extension
  of the original scope limitation [S1].'
resources:
- url: https://arxiv.org/abs/1903.01611
  title: The Lottery Ticket Hypothesis at Scale
  type: follow-up-paper
  why: Directly tests whether winning tickets exist at ImageNet/ResNet-50 scale, the
    exact open question this brief raises.
  anchor: §4-5, the ResNet-50/ImageNet experiments and the learning-rate warmup fix
    needed to stabilize pruning at scale
- url: https://arxiv.org/abs/1912.05671
  title: Linear Mode Connectivity and the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: Explains why the original rewind-to-iteration-0 procedure breaks down at scale
    and introduces 'late rewinding' as the methodological fix for larger models.
  anchor: §3, the definition of rewinding to iteration k and the Figure 1 stability
    plots
unresolved:
- Do winning tickets exist for non-vision tasks (NLP, RL)? Not addressed by the scale-focused
  follow-ups cited here.
- A learner-facing video or blog walkthrough of the at-scale follow-up work likely
  exists (e.g. a talk by Jonathan Frankle) but no specific URL could be verified with
  confidence, so none is included.
sources_consulted:
  S1: 'Frankle & Carbin, ''The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks'', ICLR 2019, arXiv:1803.03635'
  S2: Frankle, Dziugaite, Roy & Carbin, 'The Lottery Ticket Hypothesis at Scale',
    arXiv:1903.01611 (2019)
  S3: Frankle, Dziugaite, Roy & Carbin, 'Linear Mode Connectivity and the Lottery
    Ticket Hypothesis', arXiv:1912.05671 (2020), ICML
