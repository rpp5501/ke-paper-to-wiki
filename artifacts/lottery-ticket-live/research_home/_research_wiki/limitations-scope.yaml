concept: limitations-scope
status: complete
synthesis: Frankle & Carbin's original Lottery Ticket Hypothesis study limited its
  experiments to vision classification on MNIST (LeNet) and CIFAR-10 (VGG/ResNet-style
  networks), leaving open whether winning tickets exist for larger-scale datasets
  or non-vision tasks [S4]. Frankle, Dziugaite, Roy, and Carbin later showed that
  the original iterative magnitude pruning and reinitialization procedure fails to
  find winning tickets at scale, and instead proposed rewinding weights to an early
  training iteration k rather than to their original initialization, which successfully
  found sparse subnetworks in ResNet-50 and Inception-v3 on ImageNet [S1]. The official
  OpenLTH codebase implements this rewinding methodology and extends it to these larger
  architectures and datasets, giving a concrete reference for how the pruning pipeline
  must change at scale [S2]. Courses such as MIT's TinyML and Efficient Deep Learning
  Computing situate lottery tickets within the broader landscape of pruning techniques
  used for large models in practice, including discussion of the compute cost of the
  rewind-based search [S3]. Whether winning tickets exist for non-vision domains such
  as language or reinforcement learning remains comparatively less settled.
resources:
- url: https://arxiv.org/abs/1903.01611
  title: Stabilizing the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: Shows how magnitude pruning plus rewinding (instead of reinit) is needed to
    find winning tickets in larger models like ResNet-50 on ImageNet.
- url: https://github.com/facebookresearch/open_lth
  title: 'OpenLTH: A Framework for Lottery Ticket Style Experiments'
  type: reference-impl
  why: Official reference implementation showing the pruning/rewinding pipeline extended
    to ImageNet-scale architectures.
- url: https://efficientml.ai
  title: 'MIT 6.5940: TinyML and Efficient Deep Learning Computing'
  type: lecture
  why: Course lecture material situates lottery-ticket-style pruning within the broader
    set of techniques used to scale pruning to large models.
unresolved:
- Do winning tickets transfer to non-vision domains like NLP or RL at comparable scale?
- How does the rewind-iteration k need to be tuned as model or dataset size grows?
sources_consulted:
  S1: Frankle, Dziugaite, Roy, Carbin, 'Stabilizing the Lottery Ticket Hypothesis',
    arXiv:1903.01611
  S2: https://github.com/facebookresearch/open_lth
  S3: https://efficientml.ai (MIT 6.5940 TinyML and Efficient Deep Learning Computing)
  S4: 'Frankle & Carbin, ''The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks'', arXiv:1803.03635'
