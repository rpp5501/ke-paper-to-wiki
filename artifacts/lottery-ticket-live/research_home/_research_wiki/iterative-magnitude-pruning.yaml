concept: iterative-magnitude-pruning
status: complete
synthesis: 'Iterative magnitude pruning (IMP) trains a network to convergence, prunes
  a fraction (often 20%) of the lowest-magnitude weights, and resets survivors to
  their original initialization before retraining, repeating this cycle instead of
  pruning to the target sparsity in one shot [S1]. Frankle & Carbin showed iterative
  removal finds smaller winning tickets that still match dense-network accuracy than
  one-shot pruning at the same final sparsity, because each round retrains around
  the sparse structure the previous round already found rather than trusting a single
  noisy magnitude estimate [S1]. At larger scale (ResNet-50/ImageNet, BERT), naive
  rewinding to initialization becomes unstable under SGD noise, so IMP is often paired
  with rewinding to a small number of steps into training rather than to iteration
  0, which restores stability without discarding IMP''s discovered layer-wise sparsity
  [S2]. Round count and per-round rate trade off directly: aggressive one-shot or
  high-rate pruning is cheap but destroys tickets, while smaller per-round rates (~20%)
  cost more rounds of full retraining but yield tickets that stay trainable to full
  accuracy at higher final sparsity [S3].'
resources:
- url: https://paperswithcode.com/method/lottery-ticket-hypothesis
  title: Lottery Ticket Hypothesis - Papers with Code
  type: visual
  why: Diagrams and a plain-language summary of the train-prune-rewind loop, with
    links to implementations.
- url: https://github.com/facebookresearch/open_lth
  title: 'OpenLTH: A Framework for Lottery Ticket Hypothesis Research'
  type: reference-impl
  why: Official Frankle-lab codebase implementing the exact train/prune/rewind loop,
    runnable to reproduce IMP results.
- url: https://arxiv.org/abs/2003.02389
  title: Comparing Rewinding and Fine-tuning in Neural Network Pruning
  type: follow-up-paper
  why: Directly studies per-round pruning rate and rewinding-vs-fine-tuning tradeoffs
    raised in the sub-questions.
- url: https://arxiv.org/abs/1912.05671
  title: Linear Mode Connectivity and the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: Explains why naive rewind-to-init IMP becomes unstable at scale and motivates
    rewinding to an early checkpoint instead.
unresolved:
- Optimal per-round pruning rate and round count are tuned empirically per architecture/dataset
  rather than derived analytically.
- Whether IMP needs rewinding to an early checkpoint (vs. true initialization) depends
  on model/dataset scale, and the threshold isn't sharply characterized.
sources_consulted:
  S1: 'Frankle, J. & Carbin, M. ''The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks.'' ICLR 2019. https://arxiv.org/abs/1803.03635'
  S2: Frankle, J., Dziugaite, G.K., Roy, D., Carbin, M. 'Linear Mode Connectivity
    and the Lottery Ticket Hypothesis.' ICML 2020. https://arxiv.org/abs/1912.05671
  S3: Renda, A., Frankle, J., Carbin, M. 'Comparing Rewinding and Fine-tuning in Neural
    Network Pruning.' ICLR 2020. https://arxiv.org/abs/2003.02389
