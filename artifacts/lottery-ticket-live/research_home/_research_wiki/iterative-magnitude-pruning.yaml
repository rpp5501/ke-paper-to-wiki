concept: iterative-magnitude-pruning
status: complete
synthesis: 'Iterative magnitude pruning (IMP) trains a network, prunes a fraction
  (commonly ~20%) of the lowest-magnitude weights, then rewinds surviving weights
  to their original initialization before retraining, repeating this cycle across
  many rounds rather than pruning to the target sparsity in one shot [S1]. Frankle
  and Carbin show that this iterative schedule finds smaller, better-performing winning
  tickets than one-shot pruning because each round re-trains the network to re-rank
  weight importance after the previous cut, avoiding the collateral damage of removing
  too much at once [S1]. The per-round rate trades off cost against ticket quality:
  a smaller rate per round (e.g., 20% rather than 50%) requires more retraining cycles
  but yields sparser, more trainable tickets, while aggressive one-shot rates degrade
  accuracy at high sparsity [S1][S3]. Empirically only a handful of iterations (often
  under 20) are needed to reach the sparsest reliably-trainable tickets before performance
  collapses [S1]. Follow-up work visualizes how pruning masks stabilize signs and
  structure across rounds [S2].'
