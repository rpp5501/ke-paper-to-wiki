concept: noise-robustness-of-winning-tickets
status: complete
synthesis: 'Zhou et al. tested what happens when Gaussian noise is added to a winning
  ticket''s original initialization before retraining, rather than resetting weights
  exactly or fully randomizing them [S1]. They found winning tickets are notably robust
  to added noise as long as the sign of each weight relative to its original initialization
  is preserved, with performance degrading gradually rather than collapsing as noise
  magnitude grows [S1]. This points to the sign pattern of the initialization, not
  its precise magnitude, as the more load-bearing property for trainability, since
  noisy-but-sign-consistent inits still substantially outperform the random-reinitialization
  control from the original lottery ticket paper [S2]. The original paper''s random-reinit
  baseline provides the other endpoint of this spectrum: an initialization with no
  relationship at all to the original values, which trains far worse than the winning
  ticket [S2].'
resources:
- url: https://arxiv.org/abs/1905.01067
  title: 'Deconstructing Lottery Tickets: Zeros, Signs, and the Supermask'
  type: follow-up-paper
  why: runs the actual noise-injection experiment on winning ticket initializations
    and isolates sign vs. magnitude
  anchor: §3, the experiments perturbing initialization with Gaussian noise and the
    'signs are what matters' discussion
- url: https://arxiv.org/abs/1803.03635
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: reference-impl
  why: defines the winning-ticket vs. random-reinitialization baseline that noise
    levels are measured against
  anchor: §2 and Figure 1, the random reinitialization control comparison
- url: https://www.uber.com/blog/deconstructing-lottery-tickets/
  title: 'Deconstructing Lottery Tickets: Zeros, Signs, and the Supermask (Uber Engineering
    blog)'
  type: visual
  why: author-written companion post with plots of performance vs. noise magnitude,
    more approachable than the paper
  anchor: the section with the performance-vs-noise-magnitude curves
unresolved:
- exact noise magnitude at which the winning-ticket advantage disappears, and whether
  it's consistent across architectures/datasets beyond what Zhou et al. tested
- whether noise-robustness results generalize to the larger-scale settings (e.g.,
  BERT, ImageNet-scale ResNets) studied in later lottery ticket work
sources_consulted:
  S1: 'Zhou, H., Lan, J., Liu, R., & Yosinski, J. (2019). Deconstructing Lottery Tickets:
    Zeros, Signs, and the Supermask. NeurIPS 2019. arXiv:1905.01067'
  S2: 'Frankle, J., & Carbin, M. (2019). The Lottery Ticket Hypothesis: Finding Sparse,
    Trainable Neural Networks. ICLR 2019. arXiv:1803.03635'
