concept: winning-ticket-connectivity
status: partial
synthesis: 'Frankle & Carbin''s original lottery ticket paper analyzes Lenet-300-100
  winning tickets on MNIST and shows pruned masks are not uniform across hidden units:
  a subset of units in each layer retain disproportionately many incoming connections
  while many others are pruned to near-zero degree, i.e. some units act as connectivity
  hubs [S1]. Zhou et al.''s follow-up study of masks, signs, and the ''supermask''
  goes further, showing the units retaining the most weight magnitude and connections
  after pruning tend to be the ones whose sign pattern alone already encodes useful
  structure, suggesting hub units carry disproportionate task-relevant information
  rather than surviving by chance [S2]. Neither paper directly isolates whether hub
  concentration causes faster convergence; Frankle & Carbin''s headline result is
  that winning tickets train faster and reach higher accuracy than random subnetworks
  of matched sparsity, but connectivity concentration is not singled out as the causal
  factor [S1]. The official reference implementation can reproduce these per-layer
  mask statistics on Lenet-MNIST directly [S3].'
resources:
- url: https://arxiv.org/abs/1803.03635
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: visual
  why: Contains the original per-unit connectivity analysis of Lenet-300-100 winning
    tickets on MNIST, showing an uneven degree distribution across hidden units.
  anchor: Section 5 and the appendix figures analyzing per-layer/per-unit connection
    counts for the Lenet-MNIST winning tickets.
- url: https://arxiv.org/abs/1905.01067
  title: 'Deconstructing Lottery Tickets: Zeros, Signs, and the Supermask'
  type: follow-up-paper
  why: Digs deeper into which units and weights matter most after pruning, via sign
    and magnitude analysis, explaining why some units retain more structure than others.
  anchor: Section 4, the analysis of per-unit mask criteria and the 'supermask' construction.
- url: https://github.com/google-research/lottery-ticket-hypothesis
  title: google-research/lottery-ticket-hypothesis
  type: reference-impl
  why: Official code to reproduce Lenet-MNIST winning tickets and inspect per-layer
    sparsity/connectivity directly.
  anchor: mnist_fc/ experiment directory and the pruning/mask-analysis scripts.
unresolved:
- Whether concentrated connectivity in hub units causally speeds up training or is
  merely correlated with the pruning criterion used
- Whether hub-unit structure observed in small FC networks (Lenet-300-100) generalizes
  to CNNs/ResNets
sources_consulted:
  S1: 'Frankle, J. & Carbin, M. (2019). The Lottery Ticket Hypothesis: Finding Sparse,
    Trainable Neural Networks. arXiv:1803.03635'
  S2: 'Zhou, H., Lan, J., Liu, R., & Yosinski, J. (2019). Deconstructing Lottery Tickets:
    Zeros, Signs, and the Supermask. arXiv:1905.01067'
  S3: google-research/lottery-ticket-hypothesis GitHub repository
