concept: vgg-resnet-cifar10-experiments
status: complete
synthesis: 'The original lottery ticket paper extends iterative magnitude pruning
  to VGG-19 and ResNet-18 on CIFAR-10, finding winning tickets do exist at this depth,
  but only when training uses a lower learning rate with linear warmup rather than
  the standard higher rate; without warmup, one-shot pruning finds tickets only at
  mild sparsities and iterative pruning becomes unstable [S1]. The same work shows
  layer-wise pruning fails at this scale because it strips too many weights from a
  few sensitive layers, so global pruning (ranking weights across the whole network)
  is needed to find trainable subnetworks [S1]. Follow-up work shows the learning-rate-warmup
  requirement is really a symptom of training instability: rewinding pruned weights
  to their values a few iterations into training (''late resetting''/weight rewinding)
  rather than to initialization finds winning tickets for VGG/ResNet on CIFAR-10 and
  ImageNet without needing warmup, and is robust across a wider range of sparsities
  [S2]. Subsequent analysis found these late-reset winning tickets are linearly mode
  connected across independent SGD runs, explaining why they remain trainable at scale
  while iteration-0 tickets at this depth are not [S3].'
resources:
- url: https://arxiv.org/abs/1803.03635v5
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: visual
  why: Contains the original VGG-19/ResNet-18 CIFAR-10 experiments, including the
    learning-rate-warmup plots and the global-vs-layer-wise pruning comparison figure
    that directly answer the brief's sub-questions.
  anchor: Section 5, 'VGG and Resnet for CIFAR10' — the learning-rate warmup accuracy-vs-sparsity
    plots and the figure comparing global to layer-wise pruning
- url: https://arxiv.org/abs/1903.01611v3
  title: Stabilizing the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: Shows that 'late resetting' (rewinding weights to iteration k instead of 0)
    removes the need for learning-rate warmup and finds winning tickets more robustly
    in VGG/ResNet on CIFAR-10.
  anchor: The sections introducing weight rewinding/late resetting and the CIFAR-10
    VGG/ResNet result tables comparing standard reset vs. late reset
- url: https://arxiv.org/abs/1912.05671v4
  title: Linear Mode Connectivity and the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: Explains why late-reset tickets in these architectures remain trainable at
    scale by showing they are stable to SGD noise (linearly mode connected), unlike
    iteration-0 tickets.
  anchor: The ResNet-20/VGG-16 CIFAR-10 stability experiments relating linear mode
    connectivity to ticket quality
unresolved:
- Do these CIFAR-10-scale VGG/ResNet results extend to true ImageNet-scale networks
  (ResNet-50+) without further modification?
- What exactly makes late resetting sufficient to stabilize training compared to warmup,
  mechanistically?
sources_consulted:
  S1: 'Frankle & Carbin, ''The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks'' (2018), https://arxiv.org/abs/1803.03635v5'
  S2: Frankle, Dziugaite, Roy & Carbin, 'Stabilizing the Lottery Ticket Hypothesis'
    (2019), https://arxiv.org/abs/1903.01611v3
  S3: Frankle, Dziugaite, Roy & Carbin, 'Linear Mode Connectivity and the Lottery
    Ticket Hypothesis' (2019), https://arxiv.org/abs/1912.05671v4
