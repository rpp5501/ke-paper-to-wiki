concept: random-reinitialization-control
status: complete
synthesis: 'Frankle & Carbin''s lottery ticket experiments include a random-reinitialization
  control: take the mask found by iterative magnitude pruning but reinitialize the
  surviving weights randomly instead of resetting them to their original values, then
  retrain [S1]. Across MNIST and CIFAR-10 architectures this reinitialized-but-same-structure
  network trains slower and reaches lower accuracy than the true winning ticket, and
  the gap widens as sparsity increases [S1]. This isolates the two candidate explanations
  for a winning ticket''s success: the sparse connectivity pattern alone is not sufficient,
  and the specific initial weight values matter, not just which units survived pruning
  [S1]. Follow-up work refined this by showing winning tickets found late in training
  are robust to different SGD seeds even though early tickets are not, connecting
  the reinit control to instability analysis under linear mode connectivity [S3].
  The open_lth codebase implements the exact IMP-plus-reinit-control pipeline used
  in these experiments and is the standard way to reproduce them [S2].'
resources:
- url: https://arxiv.org/abs/1803.03635
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: visual
  why: Original source of the random-reinitialization control; Figure 4 directly plots
    the reinitialized-network curves against the true winning ticket
  anchor: Section 2 and Figure 4 — reinitialized-mask curves vs. winning-ticket curves
    for Lenet/Conv architectures at increasing sparsity
- url: https://github.com/facebookresearch/open_lth
  title: open_lth (Frankle's official Lottery Ticket Hypothesis codebase)
  type: reference-impl
  why: Authors' own implementation that reproduces IMP plus the reinit control exactly
  anchor: the lottery/ module and its randomly-reinitialize option in the runner/desc
    code, used to regenerate the Figure 4-style comparison
- url: https://arxiv.org/abs/1912.05671
  title: Linear Mode Connectivity and the Lottery Ticket Hypothesis
  type: follow-up-paper
  why: Extends the reinit-control logic into an instability analysis across random
    seeds, explaining why early- vs late-found tickets behave differently
  anchor: §3, the instability analysis comparing retrained tickets across different
    SGD noise seeds
unresolved:
- Does the initialization advantage persist at ImageNet scale, where the original
  reinit-control experiments were not run?
- Is the advantage attributable to init magnitude/sign alone, or to finer joint structure
  between mask and weights?
sources_consulted:
  S1: 'Frankle & Carbin, ''The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks,'' ICLR 2019, https://arxiv.org/abs/1803.03635'
  S2: facebookresearch/open_lth GitHub repository, https://github.com/facebookresearch/open_lth
  S3: Frankle, Dziugaite, Roy, Carbin, 'Linear Mode Connectivity and the Lottery Ticket
    Hypothesis,' ICML 2020, https://arxiv.org/abs/1912.05671
