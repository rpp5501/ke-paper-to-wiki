concept: random-reinitialization-control
status: partial
synthesis: 'The random-reinitialization control from Frankle & Carbin''s original
  lottery ticket experiments takes the mask (connectivity pattern) found by iterative
  magnitude pruning and applies it to freshly sampled random weights instead of the
  original initialization, then trains from scratch [S1]. This ''random ticket'' trains
  more slowly and reaches lower accuracy than the winning ticket at the same sparsity,
  showing the original initial weights, not just the sparse structure, are doing real
  work [S1]. Zhou et al. decomposed initializations into sign and magnitude and found
  that preserving the sign of the original initialization while randomizing magnitude
  retains most of the winning ticket''s advantage, whereas randomizing the sign destroys
  it [S2]. Liu et al., however, found that in many standard pruning settings, a randomly
  reinitialized pruned architecture trained from scratch can match or exceed the original
  fine-tuned weights, arguing the architecture itself often matters more than initialization
  once training budgets are large enough [S3]. Together these results suggest the
  size of the initialization advantage is regime-dependent: pronounced under the small-scale
  conditions of the original lottery ticket experiments, but attenuated in larger-scale
  pruning settings [S1][S3].'
