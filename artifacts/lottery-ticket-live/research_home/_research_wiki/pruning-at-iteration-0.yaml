concept: pruning-at-iteration-0
status: complete
synthesis: The Lottery Ticket Hypothesis showed that iteratively magnitude-pruning
  a trained network and resetting surviving weights to their original initial values
  yields a sparse 'winning ticket' that trains as well as the full network [S1]. Frankle
  & Carbin observed that the weights iterative pruning ultimately keeps already tend
  to have distinctively large magnitudes at initialization, before any training happens,
  suggesting the ticket might be readable from iteration 0 rather than only discovered
  after training [S1]. This motivated a wave of 'pruning at initialization' methods
  (SNIP, GraSP, SynFlow) that select a mask using only initial weights or a single
  gradient/flow signal [S2]. A systematic follow-up found that magnitude pruning applied
  directly at iteration 0 performs far worse than iterative magnitude pruning after
  training, and that these initialization-time methods are largely insensitive to
  weight magnitude or sign, undercutting the 'characteristic value' story as a practical
  shortcut [S3]. A separate sanity check showed randomly-selected sparse masks at
  initialization can also train competitively, further questioning how much specific
  iteration-0 weight values matter [S4].
resources:
- url: https://hanlab.mit.edu/courses/2023-fall-65940
  title: MIT 6.5940 TinyML and Efficient Deep Learning Computing (Song Han) — Pruning
    and Sparsity lectures
  type: lecture
  why: public course covering magnitude pruning, lottery tickets, and pruning-at-initialization
    methods with lecture videos and slides
- url: https://arxiv.org/abs/1803.03635
  title: 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'
  type: derivation
  why: original paper documenting the winning-ticket initialization distributions
    that motivate pruning at iteration 0
- url: https://arxiv.org/abs/2009.08576
  title: 'Pruning Neural Networks at Initialization: Why Are We Missing the Mark?'
  type: follow-up-paper
  why: directly compares iteration-0 magnitude pruning against iterative pruning after
    training, answering both sub-questions
- url: https://github.com/facebookresearch/open_lth
  title: 'OpenLTH: A Framework for Lottery Tickets and Beyond'
  type: reference-impl
  why: reference implementation for running iterative magnitude pruning and comparing
    against pruning-at-init masks
unresolved:
- Is the large-initial-magnitude signature of winning tickets a causal reason pruning
  works, or a correlate of something else (e.g. layer-wise sparsity ratios) — this
  is contested in [S3] and [S4]
- No fully verified dedicated visual/animation (e.g. distill-style diagram) specific
  to this iteration-0 interpretation was found, beyond the course slides cited
sources_consulted:
  S1: 'Frankle & Carbin, ''The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks'', arXiv:1803.03635'
  S2: Wimmer, Mehnert & Condurache, 'Recent Advances on Neural Network Pruning at
    Initialization', arXiv:2103.06460
  S3: 'Frankle, Dziugaite, Roy & Carbin, ''Pruning Neural Networks at Initialization:
    Why Are We Missing the Mark?'', arXiv:2009.08576'
  S4: 'Su et al., ''Sanity-Checking Pruning Methods: Random Tickets can Win the Jackpot'',
    arXiv:2009.11094'
