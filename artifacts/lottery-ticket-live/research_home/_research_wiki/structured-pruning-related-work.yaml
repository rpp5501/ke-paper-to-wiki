concept: structured-pruning-related-work
status: complete
synthesis: 'Neural network pruning predates the lottery ticket hypothesis by decades:
  Optimal Brain Damage showed that removing low-saliency weights after training barely
  hurts accuracy [S1], and Han et al. formalized magnitude-based iterative pruning
  plus retraining as a practical compression pipeline that shrinks networks by 9-13x
  with no accuracy loss [S2]. Deep Compression extended this with quantization and
  Huffman coding on top of pruning to shrink storage further, still starting from
  a fully trained dense network [S3]. Knowledge distillation offered a parallel compression
  route, training a small ''student'' network to mimic a large trained ''teacher''
  rather than pruning the teacher itself [S4]. All of this prior work establishes
  that trained, overparameterized networks contain far smaller subnetworks capable
  of matching full accuracy — but only after training, using the final learned weights.
  The lottery ticket hypothesis reframes this: instead of treating sparsity as a post-hoc
  compression artifact, it asks whether the pruned subnetwork, reset to its *original*
  initialization, can be trained from scratch to match the full network — shifting
  the question from ''can trained networks be compressed'' to ''was a trainable sparse
  network there from the start.'''
resources:
- url: https://jacobgil.github.io/deeplearning/pruning-deep-learning
  title: Pruning deep neural networks to make them fast and small
  type: visual
  why: walks through weight-level vs. filter-level pruning with diagrams and the standard
    prune-then-fine-tune loop that the lottery ticket paper builds on
  anchor: the diagrams contrasting weight pruning and filter/structured pruning, and
    the section on the iterative prune-retrain loop
- url: https://arxiv.org/abs/1506.02626
  title: Learning both Weights and Connections for Efficient Neural Networks (Han
    et al., 2015)
  type: follow-up-paper
  why: the canonical reference for iterative magnitude pruning + retraining, the exact
    procedure the lottery ticket hypothesis paper reuses to find winning tickets
  anchor: §3 'Regularization' and §4 'Pruning', describing the iterative prune-and-retrain
    (not retrain-from-scratch) procedure
- url: https://arxiv.org/abs/1510.00149
  title: 'Deep Compression: Compressing Deep Neural Networks with Pruning, Trained
    Quantization and Huffman Coding (Han et al., 2015)'
  type: follow-up-paper
  why: shows how far post-training pruning can shrink a network (9-49x), the compressibility
    baseline the lottery ticket paper's initialization-time question is contrasted
    against
  anchor: §3 'Pruning' and the Table 3 accuracy-vs-compression-ratio results
- url: https://arxiv.org/abs/1503.02531
  title: Distilling the Knowledge in a Neural Network (Hinton, Vinyals, Dean, 2015)
  type: follow-up-paper
  why: the other classic compression route (train a small student network directly)
    that the brief groups alongside pruning as prior overparameterization-reduction
    work
  anchor: §2 'Distillation', the softmax-temperature soft-target explanation
unresolved:
- No distill.pub-style interactive visual specific to structured/channel pruning could
  be confirmed with certainty; the Gildenblat blog post is the closest reliable visual
  explainer found.
sources_consulted:
  S1: LeCun, Denker, Solla, 'Optimal Brain Damage', NeurIPS 1989/1990 (classic pruning-by-saliency
    result, general knowledge)
  S2: Han, Pool, Tran, Dally, 'Learning both Weights and Connections for Efficient
    Neural Networks', arXiv:1506.02626
  S3: Han, Mao, Dally, 'Deep Compression', arXiv:1510.00149
  S4: Hinton, Vinyals, Dean, 'Distilling the Knowledge in a Neural Network', arXiv:1503.02531
